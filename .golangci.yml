version: '2'

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - forbidigo
    - gosec
    - govet
    - noctx
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: read the environment only in internal/config
        # Outbound HTTP goes through internal/egress, which enforces the allowlist and refuses
        # private addresses after DNS resolution.
        - pattern: ^http\.(DefaultClient|DefaultTransport|Get|Head|Post|PostForm|Client|Transport)$
          pkg: ^net/http$
          msg: make outbound HTTP requests only through internal/egress
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
  exclusions:
    generated: strict
    rules:
      - path: ^internal/config/
        linters: [forbidigo]
        text: read the environment
      - path: (^internal/egress/|_test\.go$)
        linters: [forbidigo]
        text: internal/egress
      - path: _test\.go$
        linters: [gosec, noctx]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/oldsj/opencozy-next
