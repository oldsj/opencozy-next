credentials:
  get:
    operationId: listCredentials
    summary: The household's live service and assistant credentials
    tags: [credentials]
    x-actors: [adult]
    responses:
      '200':
        description: Credentials, oldest first; secrets are never shown again
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/schemas/Credential'
      '401':
        $ref: common.yaml#/responses/Unauthorized
      '403':
        $ref: common.yaml#/responses/Forbidden
      default:
        $ref: common.yaml#/responses/Error
  post:
    operationId: createCredential
    summary: Issue a service or assistant credential
    description: Needs a sign-in within the last 10 minutes. The secret is in this response only.
    tags: [credentials]
    x-actors: [adult]
    x-command: true
    # The secret is shown once: the response is never stored for replay.
    x-record-response: false
    parameters:
      - $ref: common.yaml#/parameters/IdempotencyKey
    x-recent-auth: true
    x-body-limit: 4096
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [kind, name, scopes]
            properties:
              kind:
                type: string
                enum: [service, assistant]
              name:
                type: string
                minLength: 1
                maxLength: 80
              scopes:
                type: array
                minItems: 1
                maxItems: 32
                uniqueItems: true
                items:
                  type: string
                  maxLength: 64
              allChildren:
                type: boolean
                default: false
              childIds:
                type: array
                maxItems: 50
                uniqueItems: true
                items:
                  $ref: common.yaml#/schemas/Id
          example: { kind: service, name: Router, scopes: [children:read], allChildren: true }
    responses:
      '201':
        description: Issued
        content:
          application/json:
            schema:
              type: object
              required: [credential, secret]
              properties:
                credential:
                  $ref: '#/schemas/Credential'
                secret:
                  type: string
                  description: Shown once
      '400':
        $ref: common.yaml#/responses/BadRequest
      '401':
        $ref: common.yaml#/responses/Unauthorized
      '403':
        $ref: common.yaml#/responses/Forbidden
      '409':
        description: A retry of a credential that was already issued. Its secret is not shown again; revoke it and issue another.
        content:
          application/json:
            schema:
              $ref: common.yaml#/schemas/Error
      '422':
        $ref: common.yaml#/responses/UnprocessableEntity
      default:
        $ref: common.yaml#/responses/Error
credential:
  parameters:
    - name: credentialId
      in: path
      required: true
      schema:
        $ref: common.yaml#/schemas/Id
  delete:
    operationId: revokeCredential
    summary: Revoke a credential; it stops working at once
    tags: [credentials]
    x-actors: [adult]
    x-command: true
    parameters:
      - $ref: common.yaml#/parameters/IdempotencyKey
    responses:
      '204':
        description: Revoked
      '401':
        $ref: common.yaml#/responses/Unauthorized
      '403':
        $ref: common.yaml#/responses/Forbidden
      '404':
        $ref: common.yaml#/responses/NotFound
      '422':
        $ref: common.yaml#/responses/UnprocessableEntity
      default:
        $ref: common.yaml#/responses/Error
self:
  get:
    operationId: getOwnCredential
    summary: The calling service or assistant credential
    tags: [credentials]
    x-actors: [service, assistant]
    x-scopes: []
    responses:
      '200':
        description: The credential
        content:
          application/json:
            schema:
              $ref: '#/schemas/Credential'
      '401':
        $ref: common.yaml#/responses/Unauthorized
      '403':
        $ref: common.yaml#/responses/Forbidden
      default:
        $ref: common.yaml#/responses/Error

schemas:
  Credential:
    type: object
    required: [id, kind, name, scopes, allChildren, childIds, createdAt]
    properties:
      id:
        $ref: common.yaml#/schemas/Id
      kind:
        type: string
        enum: [service, assistant]
      name:
        type: string
      scopes:
        type: array
        items:
          type: string
      allChildren:
        type: boolean
      childIds:
        type: array
        items:
          $ref: common.yaml#/schemas/Id
      createdAt:
        type: string
        format: date-time
      expiresAt:
        type: string
        format: date-time
