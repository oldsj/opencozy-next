rewards:
  get:
    operationId: listRewards
    summary: The rewards children can spend points on
    tags: [rewards]
    x-actors: [adult, phone, display, device-web, assistant]
    x-scopes: [rewards:read]
    x-display-scopes: [today]
    responses:
      '200':
        description: The rewards, cheapest first
        content:
          application/json:
            schema:
              $ref: '#/schemas/Rewards'
      '401':
        $ref: common.yaml#/responses/Unauthorized
      '403':
        $ref: common.yaml#/responses/Forbidden
      default:
        $ref: common.yaml#/responses/Error
  post:
    operationId: createReward
    summary: Add a reward
    tags: [rewards]
    x-actors: [adult, phone]
    x-command: true
    x-body-limit: 1024
    parameters:
      - $ref: common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/schemas/NewReward'
          example: { title: 20 minutes of iPad, cost: 10, kind: screen_time, minutes: 20 }
    responses:
      '201':
        description: Added
        content:
          application/json:
            schema:
              $ref: '#/schemas/Reward'
      '400':
        $ref: common.yaml#/responses/BadRequest
      '401':
        $ref: common.yaml#/responses/Unauthorized
      '413':
        $ref: common.yaml#/responses/TooLarge
      '422':
        $ref: common.yaml#/responses/UnprocessableEntity
      default:
        $ref: common.yaml#/responses/Error
reward:
  put:
    operationId: updateReward
    summary: Edit a reward, or hide it from children
    tags: [rewards]
    x-actors: [adult]
    x-command: true
    x-body-limit: 1024
    parameters:
      - $ref: common.yaml#/parameters/IdempotencyKey
      - name: rewardId
        in: path
        required: true
        schema:
          $ref: common.yaml#/schemas/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/schemas/RewardEdit'
          example: { title: 30 min of iPad, cost: 20, kind: screen_time, minutes: 30, available: true, expectedVersion: 1 }
    responses:
      '200':
        description: Saved
        content:
          application/json:
            schema:
              $ref: '#/schemas/Reward'
      '400':
        $ref: common.yaml#/responses/BadRequest
      '401':
        $ref: common.yaml#/responses/Unauthorized
      '403':
        $ref: common.yaml#/responses/Forbidden
      '404':
        $ref: common.yaml#/responses/NotFound
      '409':
        description: '`version_conflict`: it changed since `expectedVersion`; fetch it again'
        content:
          application/json:
            schema:
              $ref: common.yaml#/schemas/Error
      '413':
        $ref: common.yaml#/responses/TooLarge
      '422':
        $ref: common.yaml#/responses/UnprocessableEntity
      default:
        $ref: common.yaml#/responses/Error
  delete:
    operationId: archiveReward
    summary: Remove a reward from now on (history stays)
    tags: [rewards]
    x-actors: [adult, phone]
    x-command: true
    parameters:
      - $ref: common.yaml#/parameters/IdempotencyKey
      - name: rewardId
        in: path
        required: true
        schema:
          $ref: common.yaml#/schemas/Id
    responses:
      '204':
        description: Removed
      '401':
        $ref: common.yaml#/responses/Unauthorized
      '404':
        $ref: common.yaml#/responses/NotFound
      '422':
        $ref: common.yaml#/responses/UnprocessableEntity
      default:
        $ref: common.yaml#/responses/Error
redemptions:
  post:
    operationId: redeemReward
    summary: Spend points on a reward
    description: >-
      The points are spent at once. Asked for on a display, it waits for an adult, who approves it
      or says no (and the points come back); asked for by an adult, it is approved at once.
      Screen time needs no approval: it is given (`fulfilled`) at once and its minutes are banked
      for the child to start later (TV time on a TV, when they watch).
    tags: [rewards]
    x-actors: [adult, phone, display, device-web]
    x-display-scopes: [today]
    x-child-param: childId
    x-command: true
    x-body-limit: 256
    parameters:
      - $ref: common.yaml#/parameters/IdempotencyKey
      - name: childId
        in: path
        required: true
        schema:
          $ref: common.yaml#/schemas/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [rewardId]
            properties:
              rewardId:
                $ref: common.yaml#/schemas/Id
          example: { rewardId: 0190f0e0-0000-7000-8000-000000000002 }
    responses:
      '201':
        description: Spent
        content:
          application/json:
            schema:
              $ref: '#/schemas/Redemption'
      '400':
        $ref: common.yaml#/responses/BadRequest
      '401':
        $ref: common.yaml#/responses/Unauthorized
      '403':
        $ref: common.yaml#/responses/Forbidden
      '404':
        $ref: common.yaml#/responses/NotFound
      '409':
        $ref: common.yaml#/responses/Conflict
      '413':
        $ref: common.yaml#/responses/TooLarge
      '422':
        $ref: common.yaml#/responses/UnprocessableEntity
      default:
        $ref: common.yaml#/responses/Error

adultRedemptions:
  get:
    operationId: listRedemptions
    summary: Rewards asked for, newest first (at most 200)
    tags: [rewards]
    x-actors: [adult, assistant]
    x-scopes: [rewards:read]
    parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/schemas/RedemptionStatus'
    responses:
      '200':
        description: The redemptions
        content:
          application/json:
            schema:
              type: object
              required: [redemptions]
              properties:
                redemptions:
                  type: array
                  items:
                    $ref: '#/schemas/RedemptionRow'
      '400':
        $ref: common.yaml#/responses/BadRequest
      '401':
        $ref: common.yaml#/responses/Unauthorized
      '403':
        $ref: common.yaml#/responses/Forbidden
      default:
        $ref: common.yaml#/responses/Error
fulfil:
  post:
    operationId: fulfilRedemption
    summary: Mark an approved reward as given
    tags: [rewards]
    x-actors: [adult]
    x-command: true
    x-body-limit: 1024
    parameters:
      - $ref: common.yaml#/parameters/IdempotencyKey
      - name: redemptionId
        in: path
        required: true
        schema:
          $ref: common.yaml#/schemas/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
              expectedVersion:
                $ref: common.yaml#/schemas/Version
          example: { expectedVersion: 2 }
    responses:
      '200':
        description: Done
        content:
          application/json:
            schema:
              $ref: '#/schemas/RedemptionRow'
      '400':
        $ref: common.yaml#/responses/BadRequest
      '401':
        $ref: common.yaml#/responses/Unauthorized
      '403':
        $ref: common.yaml#/responses/Forbidden
      '404':
        $ref: common.yaml#/responses/NotFound
      '409':
        description: '`version_conflict`, or `not_approved` (only an approved reward is given)'
        content:
          application/json:
            schema:
              $ref: common.yaml#/schemas/Error
      '413':
        $ref: common.yaml#/responses/TooLarge
      default:
        $ref: common.yaml#/responses/Error
cancel:
  post:
    operationId: cancelRedemption
    summary: Cancel an approved reward, or the unused rest of given screen time, and give the points back
    description: >
      iPad time refunds the unused share of its cost, rounded down: 409 `already_used` when none is
      left, `no_credit` when OpenCozy has no record of the time (so it can't tell how much was
      used).
    tags: [rewards]
    x-actors: [adult]
    x-command: true
    x-body-limit: 1024
    parameters:
      - $ref: common.yaml#/parameters/IdempotencyKey
      - name: redemptionId
        in: path
        required: true
        schema:
          $ref: common.yaml#/schemas/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expectedVersion]
            properties:
              expectedVersion:
                $ref: common.yaml#/schemas/Version
              reason:
                type: string
                maxLength: 200
          example: { expectedVersion: 2, reason: Changed our plans }
    responses:
      '200':
        description: Done
        content:
          application/json:
            schema:
              $ref: '#/schemas/RedemptionRow'
      '400':
        $ref: common.yaml#/responses/BadRequest
      '401':
        $ref: common.yaml#/responses/Unauthorized
      '403':
        $ref: common.yaml#/responses/Forbidden
      '404':
        $ref: common.yaml#/responses/NotFound
      '409':
        description: '`version_conflict`; `not_cancellable` (pending, rejected, cancelled, or a given item); `already_used` (all of the screen time was used)'
        content:
          application/json:
            schema:
              $ref: common.yaml#/schemas/Error
      '413':
        $ref: common.yaml#/responses/TooLarge
      default:
        $ref: common.yaml#/responses/Error

schemas:
  Rewards:
    type: object
    required: [rewards]
    properties:
      rewards:
        type: array
        items:
          $ref: '#/schemas/Reward'
  NewReward:
    type: object
    additionalProperties: false
    required: [title, cost, kind]
    properties:
      title:
        $ref: chores.yaml#/schemas/Title
      cost:
        type: integer
        minimum: 1
        maximum: 100000
      kind:
        type: string
        enum: [item, screen_time]
      minutes:
        type: integer
        minimum: 1
        maximum: 1440
        description: Required for screen_time, refused otherwise
      target:
        $ref: screentime.yaml#/schemas/Target
        description: For screen_time, which screen (ipad when absent); refused otherwise
  RewardEdit:
    type: object
    additionalProperties: false
    required: [title, cost, kind, available, expectedVersion]
    properties:
      title:
        $ref: chores.yaml#/schemas/Title
      cost:
        type: integer
        minimum: 1
        maximum: 100000
      kind:
        type: string
        enum: [item, screen_time]
      minutes:
        type: integer
        minimum: 1
        maximum: 1440
        description: Required for screen_time, refused otherwise
      target:
        $ref: screentime.yaml#/schemas/Target
        description: For screen_time, which screen (unchanged when absent); refused otherwise
      available:
        type: boolean
        description: false hides it from children
      expectedVersion:
        $ref: common.yaml#/schemas/Version
  Reward:
    type: object
    required: [id, title, cost, kind, available, version]
    properties:
      id:
        $ref: common.yaml#/schemas/Id
      title:
        type: string
      cost:
        type: integer
      kind:
        type: string
        enum: [item, screen_time]
      minutes:
        type: integer
      target:
        $ref: screentime.yaml#/schemas/Target
        description: For screen_time, which screen
      available:
        type: boolean
      version:
        $ref: common.yaml#/schemas/Version
  RedemptionStatus:
    type: string
    enum: [pending, approved, fulfilled, rejected, cancelled]
  RedemptionChild:
    type: object
    required: [id, name, color]
    properties:
      id:
        $ref: common.yaml#/schemas/Id
      name:
        type: string
      color:
        $ref: children.yaml#/schemas/ProfileColor
  RedemptionRow:
    type: object
    description: A redemption as an adult sees it. approved is waiting to be given; fulfilled has been given.
    required: [id, child, title, cost, status, requestedAt, refundedPoints, cancellable, version]
    properties:
      id:
        $ref: common.yaml#/schemas/Id
      child:
        $ref: '#/schemas/RedemptionChild'
      title:
        type: string
      cost:
        type: integer
      status:
        $ref: '#/schemas/RedemptionStatus'
      requestedAt:
        type: string
        format: date-time
      fulfilledAt:
        type: string
        format: date-time
      cancelledAt:
        type: string
        format: date-time
      minutes:
        type: integer
        description: Screen time bought
      target:
        $ref: screentime.yaml#/schemas/Target
        description: For screen time, which screen
      usedMinutes:
        type: integer
        description: iPad time used so far, rounded up
      refundedPoints:
        type: integer
        description: Points given back (a rejection or a cancellation)
      cancellable:
        type: boolean
        description: >-
          Whether cancelRedemption can take it back: approved, or given screen time with its own
          record of the time. Imported screen time has none (its time is in the child's balance),
          so it isn't. Time already all used is refused too (usedMinutes).
      version:
        $ref: common.yaml#/schemas/Version
  Redemption:
    type: object
    required: [id, status]
    properties:
      id:
        $ref: common.yaml#/schemas/Id
      status:
        $ref: '#/schemas/RedemptionStatus'
