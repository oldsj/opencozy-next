openapi: 3.1.0
info:
  title: OpenCozy API
  version: 0.1.0
  description: |
    The wire contract for every OpenCozy client. Each domain's operations live in their own file
    in api/src/; `make gen` bundles them into api/openapi.yaml, and the Go server (internal/api)
    and the TypeScript client (web/src/api/schema.gen.ts) are generated from that.

    **Who may call what** is declared on each operation, and the declaration is the check
    (internal/authz): `x-actors` lists the actor kinds allowed (`public` for none needed),
    `x-scopes` the scopes a service or assistant credential needs, `x-display-scopes` the scopes
    a wall display needs, `x-child-param` the path parameter naming a child, `x-recent-auth` an
    adult sign-in within 10 minutes, and `x-body-limit` the body cap in bytes (default 64 KiB).
    An operation without `x-actors` is refused and stops the server from starting.

    Credentials: the adult web session is the `__Host-session` cookie, a wall display the
    `__Host-display` cookie; parent phones (`ocp_`), service credentials (`ocz_`) and assistants
    (`oca_`) send `Authorization: Bearer`. Every authentication failure is the same 401.
    Cross-site state-changing requests with cookies are refused by Go's `http.CrossOriginProtection`.
servers:
  - url: /api
tags:
  - name: auth
    description: Adult sign-in
  - name: household
    description: The caller's household
  - name: children
    description: Children of the household
  - name: credentials
    description: Service and assistant credentials
  - name: live
    description: Live updates over a WebSocket

# One line per path; the operations live in the domain files.
paths:
  /auth/login:
    $ref: auth.yaml#/login
  /auth/logout:
    $ref: auth.yaml#/logout
  /auth/me:
    $ref: auth.yaml#/me
  /auth/confirm:
    $ref: auth.yaml#/confirm
  /household:
    $ref: household.yaml#/household
  /children:
    $ref: children.yaml#/children
  /children/{childId}:
    $ref: children.yaml#/child
  /credentials:
    $ref: credentials.yaml#/credentials
  /credentials/{credentialId}:
    $ref: credentials.yaml#/credential
  /credential:
    $ref: credentials.yaml#/self
  /display/pairings:
    $ref: displays.yaml#/pairings
  /display/pairings/claim:
    $ref: displays.yaml#/claim
  /displays:
    $ref: displays.yaml#/displays
  /displays/{displayId}:
    $ref: displays.yaml#/display
  /today:
    $ref: today.yaml#/today
  /today/chores/{choreId}/complete:
    $ref: today.yaml#/completeChore
  /today/routines/{routineId}/steps/{stepId}/check:
    $ref: today.yaml#/checkStep
  /children/{childId}/history:
    $ref: points.yaml#/history
  /points/{entryId}/reverse:
    $ref: points.yaml#/reverse
  /inbox:
    $ref: inbox.yaml#/inbox
  /inbox/{itemId}/approve:
    $ref: inbox.yaml#/approve
  /inbox/{itemId}/reject:
    $ref: inbox.yaml#/reject
  /chores:
    $ref: chores.yaml#/chores
  /chores/{choreId}:
    $ref: chores.yaml#/chore
  /routines:
    $ref: chores.yaml#/routines
  /routines/{routineId}:
    $ref: chores.yaml#/routine
  /live:
    $ref: live.yaml#/live

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
    display:
      type: apiKey
      in: cookie
      name: __Host-display
    bearer:
      type: http
      scheme: bearer
