components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
    display:
      type: apiKey
      in: cookie
      name: __Host-display
    device:
      type: apiKey
      in: header
      name: X-OpenCozy-Signature
      description: Signed device request; see the API description
    deviceWeb:
      type: apiKey
      in: cookie
      name: __Host-device
    bearer:
      type: http
      scheme: bearer
