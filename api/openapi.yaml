        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /calendar:
    get:
      operationId: getCalendar
      summary: Events between two household days
      description: |
        Events that overlap the days [from, to), at most 42 days. Timed events are RFC3339 in the
        household's time zone; all-day events are dates with an exclusive end. Cancelled events are
        never sent. A display sees only calendars shown on displays.
      tags:
        - calendar
      x-actors:
        - adult
        - phone
        - display
      x-display-scopes:
        - calendar
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Exclusive
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The events, by start
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /calendar/events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getCalendarEvent
      summary: One event, with its description
      tags:
        - calendar
      x-actors:
        - adult
        - phone
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /calendar/events/{eventId}/children:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    put:
      operationId: assignEventChildren
      summary: Say which children an event is for
      description: |
        `series` sets every occurrence and clears per-occurrence choices; `occurrence` sets this one
        only, and wins over the series. An empty list means nobody.
      tags:
        - calendar
      x-actors:
        - adult
        - phone
      x-command: true
      x-body-limit: 4096
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignChildren'
            example:
              children: []
              scope: series
      responses:
        '200':
          description: The event, with its children
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /calendars:
    get:
      operationId: listCalendars
      summary: The calendars the household follows
      description: A feed's address is never returned.
      tags:
        - calendar
      x-actors:
        - adult
        - phone
      responses:
        '200':
          description: The calendars, by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addCalendarLink
      summary: Follow a calendar by its link (ICS or webcal)
      description: |
        The link is stored encrypted and never shown back. The first refresh runs within a minute;
        until then the calendar has no `lastSyncAt`. 409 `calendar_exists` when the household
        already follows that link; 422 `invalid_link`, or `not_configured` when the server has no
        secret keys (OPENCOZY_SECRET_KEYS); 422 `too_many_calendars` past 50.
      tags:
        - calendar
      x-actors:
        - adult
        - phone
      x-command: true
      x-body-limit: 4096
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCalendarLink'
            example:
              name: School
              url: https://calendar.example.test/school.ics
              color: butter
              showOnDisplay: true
      responses:
        '201':
          description: Following
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /calendars/{calendarId}:
    parameters:
      - name: calendarId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    patch:
      operationId: updateCalendar
      summary: Rename a calendar, recolour it, or show or hide it on displays
      tags:
        - calendar
      x-actors:
        - adult
        - phone
      x-command: true
      x-body-limit: 2048
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEdit'
            example:
              name: School
              color: butter
              showOnDisplay: false
              expectedVersion: 1
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeCalendar
      summary: Stop following a calendar, with its events and assignments
      tags:
        - calendar
      x-actors:
        - adult
        - phone
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: expectedVersion
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        '204':
          description: Removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
    display:
      type: apiKey
      in: cookie
      name: __Host-display
    bearer:
      type: http
      scheme: bearer
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable, machine-readable, snake_case
          examples:
            - not_found
        message:
          type: string
          description: Safe to show to the user; never contains internals
    Error:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    Id:
      type: string
      format: uuid
    Household:
      type: object
      required:
        - id
        - name
        - timeZone
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        timeZone:
          type: string
          description: IANA zone name; the household day follows it
          examples:
            - Europe/Amsterdam
    Me:
      type: object
      required:
        - adult
        - household
      properties:
        adult:
          type: object
          required:
            - id
            - email
            - name
          properties:
            id:
              $ref: '#/components/schemas/Id'
            email:
              type: string
            name:
              type: string
        household:
          $ref: '#/components/schemas/Household'
    PasskeyOptions:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - options
      properties:
        challengeId:
          $ref: '#/components/schemas/Id'
        options:
          type: object
          additionalProperties: true
          description: PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON
    PasskeyResponse:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - credential
      properties:
        challengeId:
          $ref: '#/components/schemas/Id'
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential.toJSON()
    Passkey:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - createdAt
        - backedUp
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        backedUp:
          type: boolean
          description: Synced to a password manager or cloud keychain, so it survives losing the device.
    Passkeys:
      type: object
      additionalProperties: false
      required:
        - passkeys
      properties:
        passkeys:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Passkey'
    NewPasskey:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - name
        - credential
      properties:
        challengeId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 80
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential.toJSON()
    ProfileColor:
      type: string
      enum:
        - rose
        - sage
        - sky
        - butter
        - lilac
        - peach
        - teal
        - sand
    Child:
      type: object
      required:
        - id
        - name
        - color
        - archived
        - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        color:
          $ref: '#/components/schemas/ProfileColor'
        archived:
          type: boolean
        version:
          type: integer
    ChildName:
      type: string
      minLength: 1
      maxLength: 40
      pattern: \S
    Credential:
      type: object
      required:
        - id
        - kind
        - name
        - scopes
        - allChildren
        - childIds
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
            - service
            - assistant
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        allChildren:
          type: boolean
        childIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Pairing:
      type: object
      required:
