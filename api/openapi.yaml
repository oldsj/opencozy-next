        end:
          type: string
          description: RFC3339, or the exclusive end date when allDay
        status:
          type: string
          enum:
            - confirmed
            - tentative
        calendar:
          $ref: '#/components/schemas/CalendarRef'
        location:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/Id'
