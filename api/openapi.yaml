  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request does not match the contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No live credential. The same response for every authentication failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: The request body is over the operation's limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited; retry after the Retry-After header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: This caller may not do this, including any cross-origin unsafe request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource for this caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The resource changed, or already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: This Idempotency-Key was already used for a different request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Not available on this server until it is configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    SetSession:
      description: Sets or clears the __Host-session cookie
      schema:
        type: string
    SetSignIn:
      description: Sets the __Host-oidc cookie that binds the sign-in to this browser (10 minutes; the callback clears it)
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every state change. A retry with the same key, from the same caller with the
        same body, gets the first answer (for 30 days) instead of doing it again.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ChildId:
      name: childId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
