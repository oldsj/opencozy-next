        id:
          $ref: '#/components/schemas/Id'
        at:
          type: string
          format: date-time
        action:
          type: string
          enum:
            - open
            - extend
            - close
        tvId:
          $ref: '#/components/schemas/Id'
        tvName:
          type: string
        until:
          type:
            - string
            - 'null'
          format: date-time
        byName:
          type:
            - string
            - 'null'
        viaAssistant:
          type: boolean
        endedSessionId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
    TvHistory:
      type: object
      required:
        - sessions
        - openings
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TvSession'
        openings:
          type: array
          items:
            $ref: '#/components/schemas/TvOpening'
    OpenTvs:
      type: object
      description: Every TV (all) or the ones listed, not both, for 1 hour, 2 hours or until midnight
      additionalProperties: false
      required:
        - duration
      properties:
        all:
          type: boolean
        tvIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
        duration:
          type: string
          enum:
            - 1h
            - 2h
            - all_day
    OpenedTv:
      type: object
      required:
        - id
        - name
        - openUntil
        - openClosesAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        openUntil:
          type:
            - string
            - 'null'
          format: date-time
        openClosesAt:
          type:
            - string
            - 'null'
          format: date-time
    OpenedTvs:
      type: object
      required:
        - serverTime
        - tvs
        - endedSessions
      properties:
        serverTime:
          type: string
          format: date-time
        tvs:
          type: array
          items:
            $ref: '#/components/schemas/OpenedTv'
        endedSessions:
          type: array
          items:
            $ref: '#/components/schemas/TvSession'
    ChosenTvs:
      type: object
      description: Every TV (all) or the ones listed, not both
      additionalProperties: false
      properties:
        all:
          type: boolean
        tvIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
    TvEdit:
      type: object
      additionalProperties: false
      required:
        - name
        - room
        - macs
        - haEntityId
        - openHours
        - expectedVersion
      properties:
        name:
          $ref: '#/components/schemas/TvName'
        room:
          $ref: '#/components/schemas/Room'
        macs:
          $ref: '#/components/schemas/Macs'
        haEntityId:
          oneOf:
            - $ref: '#/components/schemas/EntityId'
            - type: 'null'
        openHours:
          oneOf:
            - $ref: '#/components/schemas/OpenHours'
            - type: 'null'
        expectedVersion:
          $ref: '#/components/schemas/Version'
    StartTvSession:
      type: object
      additionalProperties: false
      required:
        - watcher
      properties:
        watcher:
          type: string
          enum:
            - parents
            - child
        childId:
          $ref: '#/components/schemas/Id'
    EndedTvSession:
      type: object
      required:
        - session
      properties:
        session:
          oneOf:
            - $ref: '#/components/schemas/TvSession'
            - type: 'null'
    TvAsked:
      type: object
      required:
        - 'on'
        - asking
      properties:
        'on':
          type: boolean
          description: Already on (a session) or open
        asking:
          type: boolean
    TvPromptAnswer:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - answer
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        answer:
          type: string
          enum:
            - parents
            - child
            - not_now
        childId:
          $ref: '#/components/schemas/Id'
    TvPromptAnswered:
      type: object
      required:
        - prompt
        - session
      properties:
        prompt:
          type: object
          required:
            - id
            - version
            - state
          properties:
            id:
              $ref: '#/components/schemas/Id'
            version:
              $ref: '#/components/schemas/Version'
            state:
              type: string
              enum:
                - answered
                - dismissed
        session:
          oneOf:
            - $ref: '#/components/schemas/TvSession'
            - type: 'null'
    WatchTv:
      type: object
      additionalProperties: false
      required:
        - tvId
      properties:
        tvId:
          $ref: '#/components/schemas/Id'
    TvAllowance:
      type: object
      required:
        - mac
        - secondsRemaining
      properties:
        mac:
          type: string
        secondsRemaining:
          type: integer
          minimum: 1
          maximum: 300
    TvAllowances:
      type: object
      required:
        - serverTime
        - allowances
      properties:
        serverTime:
          type: string
          format: date-time
        allowances:
          type: array
          items:
            $ref: '#/components/schemas/TvAllowance'
    TvAttempt:
      type: object
      additionalProperties: false
      required:
        - mac
        - lastSeenAt
      properties:
        mac:
          $ref: '#/components/schemas/Mac'
        lastSeenAt:
          type: string
          format: date-time
    TvAttempts:
      type: object
      additionalProperties: false
      required:
        - attempts
      properties:
        attempts:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/TvAttempt'
    TvAttemptResult:
      type: object
      required:
        - mac
        - state
      properties:
        mac:
          type: string
        state:
          type: string
          enum:
            - requested
            - pending
            - open
            - suppressed
            - unknown
    TvAttemptResults:
      type: object
      required:
        - serverTime
        - results
      properties:
        serverTime:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: '#/components/schemas/TvAttemptResult'
    TvPowerReport:
      type: object
      additionalProperties: false
      required:
        - entityId
        - state
      properties:
        entityId:
          $ref: '#/components/schemas/EntityId'
        state:
          type: string
          maxLength: 32
          pattern: ^[a-z_]{1,32}$
          description: The media_player state (on, playing, buffering, idle, paused, off, standby, unavailable, …)
        lastChanged:
          type: string
          format: date-time
    TvPowerResult:
      type: object
      required:
        - tvId
        - power
        - online
        - asking
      properties:
        tvId:
          $ref: '#/components/schemas/Id'
        power:
          $ref: '#/components/schemas/TvPower'
        online:
          type: boolean
        asking:
          type: boolean
  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request does not match the contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No live credential. The same response for every authentication failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: The request body is over the operation's limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited; retry after the Retry-After header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: This caller may not do this, including any cross-origin unsafe request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource for this caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The resource changed, or already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: This Idempotency-Key was already used for a different request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Not available on this server until it is configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Opened:
      description: The TVs it changed, and any sessions opening ended
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpenedTvs'
    StartConflict:
      description: tv_open (it's open, nobody needs to turn it on), child_unavailable, already_watching (another TV), no_tv_time, or outside_hours
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    SetSession:
      description: Sets or clears the __Host-session cookie
      schema:
        type: string
    SetSignIn:
      description: Sets the __Host-oidc cookie that binds the sign-in to this browser (10 minutes; the callback clears it)
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every state change. A retry with the same key, from the same caller with the
        same body, gets the first answer (for 30 days) instead of doing it again.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ChildId:
      name: childId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TvId:
      name: tvId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
