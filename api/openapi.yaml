openapi: 3.1.0
info:
  title: OpenCozy API
  version: 0.1.0
  description: |
    The wire contract for every OpenCozy client. Each domain's operations live in their own file
    in api/src/; `make gen` bundles them into api/openapi.yaml, and the Go server (internal/api)
    and the TypeScript client (web/src/api/schema.gen.ts) are generated from that.

    **Who may call what** is declared on each operation, and the declaration is the check
    (internal/authz): `x-actors` lists the actor kinds allowed (`public` for none needed),
    `x-scopes` the scopes a service or assistant credential needs, `x-display-scopes` the scopes
    a wall display needs, `x-child-param` the path parameter naming a child, `x-recent-auth` an
    adult sign-in within 10 minutes, and `x-body-limit` the body cap in bytes (default 64 KiB).
    An operation without `x-actors` is refused and stops the server from starting.

    Credentials: the adult web session is the `__Host-session` cookie, a wall display the
    `__Host-display` cookie; parent phones (`ocp_`), service credentials (`ocz_`) and assistants
    (`oca_`) send `Authorization: Bearer`. Every authentication failure is the same 401.
    Cross-site state-changing requests with cookies are refused by Go's `http.CrossOriginProtection`.

    **Signed device requests** (the `device` actor, slice 7). A paired kid app signs every
    request with the P-256 key it made at pairing, in four headers:
    `X-OpenCozy-Device` (the device id), `X-OpenCozy-Timestamp` (Unix seconds),
    `X-OpenCozy-Nonce` (16–64 characters of `[A-Za-z0-9_-]`, new for every request) and
    `X-OpenCozy-Signature` (ECDSA P-256 over SHA-256, raw r||s, base64url, 86 characters) of

        OPENCOZY-DEVICE-V1\n<METHOD>\n<path and query, as sent, from /api>\n<timestamp>\n<nonce>\n<hex sha256 of the body>\n<device id>

    A timestamp more than 60 seconds off, a nonce already seen from that device in the last
    300 seconds, an unknown or unpaired device, a device whose child is archived, or a bad
    signature all get the same 401; its `Date` header lets the app correct its clock. The device
    acts only for its own child. Its web view uses the `__Host-device` cookie (`device-web`, 24
    hours, also only its child). A present device cookie decides the request on its own: when it
    is no longer valid the request gets 401, never the adult or display cookie beside it, and
    signing in while it is present is refused (409 `kid_device`).
    Clients send `X-OpenCozy-Client: <app>/<version>`; a client too old for the server gets 426.
servers:
  - url: /api
tags:
  - name: auth
    description: Adult sign-in
  - name: household
    description: The caller's household
  - name: devices
    description: Kid devices (iPad, iPhone) and their pairing
  - name: children
    description: Children of the household
  - name: credentials
    description: Service and assistant credentials
  - name: live
    description: Live updates over a WebSocket
  - name: meals
    description: Recipes and the meal plan
  - name: calendar
    description: Followed calendars, their events, and who they are for
  - name: screentime
    description: iPad screen time, allowed hours, time requests and blocked websites
  - name: learning
    description: Learning-app awards, their rules and children's linked accounts
  - name: tvs
    description: The TV gate - TVs, sessions, "Who's watching?", open hours, the router and Home Assistant
paths:
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags:
        - auth
      x-actors:
        - public
      x-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: adult@example.test
              password: a long enough password
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A child's device (`kid_device`, the request carries a device cookie); sign in elsewhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out and end the session
      tags:
        - auth
      x-actors:
        - public
      x-body-limit: 1
      responses:
        '204':
          description: Signed out (also when there was no session)
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in adult and their household
      tags:
        - auth
      x-actors:
        - adult
      responses:
        '200':
          description: The signed-in adult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /auth/confirm:
    post:
      operationId: confirmSignIn
      summary: Enter the password again, for operations that need a recent sign-in
      tags:
        - auth
      x-actors:
        - adult
      x-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
            example:
              password: a long enough password
      responses:
        '204':
          description: Confirmed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /auth/methods:
    get:
      operationId: getSignInMethods
      summary: How adults can sign in here, for the sign-in page
      tags:
        - auth
      x-actors:
        - public
      responses:
        '200':
          description: The sign-in methods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInMethods'
        default:
          $ref: '#/components/responses/Error'
  /auth/oidc/start:
    post:
      operationId: startOidcSignIn
      summary: Start signing in with the single sign-on provider
      tags:
        - auth
      x-actors:
        - public
      x-body-limit: 1
      responses:
        '200':
          description: Send the browser to `url`
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSignIn'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A child's device (`kid_device`, the request carries a device cookie); sign in elsewhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: The provider can't be reached (`oidc_unavailable`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /auth/callback/oidc:
    get:
      operationId: oidcCallback
      summary: Where the provider sends the browser back; redirects to the app
      description: |
        Registered at the provider as `<PUBLIC_ORIGIN>/api/auth/callback/oidc`, the old app's path.
        Every outcome is a 303: to `/` with a new session, or to `/login?error=<code>`.
      tags:
        - auth
      x-actors:
        - public
      parameters:
        - name: code
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: state
          in: query
          schema:
            type: string
            maxLength: 256
        - name: iss
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: error
          in: query
          schema:
            type: string
            maxLength: 256
        - name: __Host-oidc
          in: cookie
          schema:
            type: string
            maxLength: 256
      responses:
        '303':
          description: Back to the app
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
        default:
          $ref: '#/components/responses/Error'
  /auth/oidc/link:
    get:
      operationId: getOidcLink
      summary: Your single sign-on link, if you have one
      tags:
        - auth
      x-actors:
        - adult
      responses:
        '200':
          description: The link, or null when there is none
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - link
                properties:
                  link:
                    oneOf:
                      - $ref: '#/components/schemas/OidcLink'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: unlinkOidc
      summary: Unlink your single sign-on account
      description: |
        Signing in with the provider stops working for you until you use it again, when it links
        afresh by your verified email. Your password and passkeys keep working.
      tags:
        - auth
      x-actors:
        - adult
      x-recent-auth: true
      responses:
        '204':
          description: Unlinked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkey/options:
    post:
      operationId: passkeySignInOptions
      summary: Start signing in with a passkey
      tags:
        - auth
      x-actors:
        - public
      responses:
        '200':
          description: Options for navigator.credentials.get
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkey:
    post:
      operationId: passkeySignIn
      summary: Sign in with a passkey
      tags:
        - auth
      x-actors:
        - public
      x-body-limit: 16384
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
            example:
              challengeId: 0195f2d4-0000-7000-8000-000000000000
              credential: {}
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A child's device (`kid_device`, the request carries a device cookie); sign in elsewhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkey/confirm/options:
    post:
      operationId: passkeyConfirmOptions
      summary: Start confirming this sign-in with one of your passkeys
      tags:
        - auth
      x-actors:
        - adult
      responses:
        '200':
          description: Options for navigator.credentials.get
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkey/confirm:
    post:
      operationId: passkeyConfirm
      summary: Confirm this sign-in with a passkey, for operations that need a recent sign-in
      tags:
        - auth
      x-actors:
        - adult
      x-body-limit: 16384
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
            example:
              challengeId: 0195f2d4-0000-7000-8000-000000000000
              credential: {}
      responses:
        '204':
          description: Confirmed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkeys:
    get:
      operationId: listPasskeys
      summary: Your passkeys
      tags:
        - auth
      x-actors:
        - adult
      responses:
        '200':
          description: Your passkeys, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkeys'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addPasskey
      summary: Add a passkey
      tags:
        - auth
      x-actors:
        - adult
      x-recent-auth: true
      x-body-limit: 16384
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPasskey'
            example:
              challengeId: 0195f2d4-0000-7000-8000-000000000000
              name: Laptop
              credential: {}
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkeys/options:
    post:
      operationId: passkeyRegistrationOptions
      summary: Start adding a passkey
      tags:
        - auth
      x-actors:
        - adult
      x-recent-auth: true
      responses:
        '200':
          description: Options for navigator.credentials.create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkeys/{passkeyId}:
    parameters:
      - name: passkeyId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      operationId: removePasskey
      summary: Remove a passkey; it stops working at once
      tags:
        - auth
      x-actors:
        - adult
      x-recent-auth: true
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
  /household:
    get:
      operationId: getHousehold
      summary: The caller's household
      tags:
        - household
      x-actors:
        - adult
        - phone
        - display
        - service
        - assistant
      x-scopes:
        - household:read
      x-display-scopes:
        - today
      responses:
        '200':
          description: The household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateHousehold
      summary: Rename the household or change its time zone (the household day follows it)
      tags:
        - household
      x-actors:
        - adult
      x-command: true
      x-body-limit: 1024
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - expectedVersion
              minProperties: 2
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  pattern: \S
                timeZone:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: An IANA zone name (`time_zone_unknown` otherwise)
                expectedVersion:
                  $ref: '#/components/schemas/Version'
            example:
              name: The Rivera household
              timeZone: America/New_York
              expectedVersion: 2
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`version_conflict`: it changed since `expectedVersion`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /children:
    get:
      operationId: listChildren
      summary: The children the caller may act for
      tags:
        - children
      x-actors:
        - adult
        - phone
        - display
        - service
        - assistant
      x-scopes:
        - children:read
      x-display-scopes:
        - today
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Children, oldest first
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChild
      summary: Add a child
      tags:
        - children
      x-actors:
        - adult
        - phone
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-body-limit: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  $ref: '#/components/schemas/ChildName'
                color:
                  $ref: '#/components/schemas/ProfileColor'
            example:
              name: Robin
              color: sage
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /children/{childId}:
    parameters:
      - name: childId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getChild
      summary: One child
      tags:
        - children
      x-actors:
        - adult
        - phone
        - display
        - service
        - assistant
      x-scopes:
        - children:read
      x-display-scopes:
        - today
      x-child-param: childId
      responses:
        '200':
          description: The child
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateChild
      summary: Rename a child, or archive or restore them
      tags:
        - children
      x-actors:
        - adult
        - phone
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-child-param: childId
      x-body-limit: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - archived
                - expectedVersion
              properties:
                name:
                  $ref: '#/components/schemas/ChildName'
                archived:
                  type: boolean
                expectedVersion:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
            example:
              name: Robin
              archived: false
              expectedVersion: 1
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /credentials:
    get:
      operationId: listCredentials
      summary: The household's live service and assistant credentials
      tags:
        - credentials
      x-actors:
        - adult
      responses:
        '200':
          description: Credentials, oldest first; secrets are never shown again
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCredential
      summary: Issue a service or assistant credential
      description: Needs a sign-in within the last 10 minutes. The secret is in this response only.
      tags:
        - credentials
      x-actors:
        - adult
      x-command: true
      x-record-response: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-recent-auth: true
      x-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - kind
                - name
                - scopes
              properties:
                kind:
                  type: string
                  enum:
                    - service
                    - assistant
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
