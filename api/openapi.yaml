openapi: 3.1.0
info:
  title: OpenCozy API
  version: 0.1.0
  description: |
    The wire contract for every OpenCozy client. Each domain's operations live in their own file
    in api/src/; `make gen` bundles them into api/openapi.yaml, and the Go server (internal/api)
    and the TypeScript client (web/src/api/schema.gen.ts) are generated from that.

    **Who may call what** is declared on each operation, and the declaration is the check
    (internal/authz): `x-actors` lists the actor kinds allowed (`public` for none needed),
    `x-scopes` the scopes a service or assistant credential needs, `x-display-scopes` the scopes
    a wall display needs, `x-child-param` the path parameter naming a child, `x-recent-auth` an
    adult sign-in within 10 minutes, and `x-body-limit` the body cap in bytes (default 64 KiB).
    An operation without `x-actors` is refused and stops the server from starting.

    Credentials: the adult web session is the `__Host-session` cookie, a wall display the
    `__Host-display` cookie; parent phones (`ocp_`), service credentials (`ocz_`) and assistants
    (`oca_`) send `Authorization: Bearer`. Every authentication failure is the same 401.
    Cross-site state-changing requests with cookies are refused by Go's `http.CrossOriginProtection`.
servers:
  - url: /api
tags:
  - name: auth
    description: Adult sign-in
  - name: household
    description: The caller's household
  - name: children
    description: Children of the household
  - name: credentials
    description: Service and assistant credentials
  - name: live
    description: Live updates over a WebSocket
paths:
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags:
        - auth
      x-actors:
        - public
      x-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: adult@example.test
              password: a long enough password
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out and end the session
      tags:
        - auth
      x-actors:
        - public
      x-body-limit: 1
      responses:
        '204':
          description: Signed out (also when there was no session)
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in adult and their household
      tags:
        - auth
      x-actors:
        - adult
      responses:
        '200':
          description: The signed-in adult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /auth/confirm:
    post:
      operationId: confirmSignIn
      summary: Enter the password again, for operations that need a recent sign-in
      tags:
        - auth
      x-actors:
        - adult
      x-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
            example:
              password: a long enough password
      responses:
        '204':
          description: Confirmed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /household:
    get:
      operationId: getHousehold
      summary: The caller's household
      tags:
        - household
      x-actors:
        - adult
        - phone
        - display
        - service
        - assistant
      x-scopes:
        - household:read
      x-display-scopes:
        - today
      responses:
        '200':
          description: The household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /children:
    get:
      operationId: listChildren
      summary: The children the caller may act for
      tags:
        - children
      x-actors:
        - adult
        - phone
        - display
        - service
        - assistant
      x-scopes:
        - children:read
      x-display-scopes:
        - today
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Children, oldest first
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChild
      summary: Add a child
      tags:
        - children
      x-actors:
        - adult
        - phone
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-body-limit: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  $ref: '#/components/schemas/ChildName'
            example:
              name: Robin
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /children/{childId}:
    parameters:
      - name: childId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getChild
      summary: One child
      tags:
        - children
      x-actors:
        - adult
        - phone
        - display
        - service
        - assistant
      x-scopes:
        - children:read
      x-display-scopes:
        - today
      x-child-param: childId
      responses:
        '200':
          description: The child
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateChild
      summary: Rename a child, or archive or restore them
      tags:
        - children
      x-actors:
        - adult
        - phone
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-child-param: childId
      x-body-limit: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - archived
                - expectedVersion
              properties:
                name:
                  $ref: '#/components/schemas/ChildName'
                archived:
                  type: boolean
                expectedVersion:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
            example:
              name: Robin
              archived: false
              expectedVersion: 1
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /credentials:
    get:
      operationId: listCredentials
      summary: The household's live service and assistant credentials
      tags:
        - credentials
      x-actors:
        - adult
      responses:
        '200':
          description: Credentials, oldest first; secrets are never shown again
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCredential
      summary: Issue a service or assistant credential
      description: Needs a sign-in within the last 10 minutes. The secret is in this response only.
      tags:
        - credentials
      x-actors:
        - adult
      x-command: true
      x-record-response: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-recent-auth: true
      x-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - kind
                - name
                - scopes
              properties:
                kind:
                  type: string
                  enum:
                    - service
                    - assistant
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 32
                  uniqueItems: true
                  items:
                    type: string
                    maxLength: 64
                allChildren:
                  type: boolean
                  default: false
                childIds:
                  type: array
                  maxItems: 50
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Id'
            example:
              kind: service
              name: Router
              scopes:
                - children:read
              allChildren: true
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                type: object
                required:
                  - credential
                  - secret
                properties:
                  credential:
                    $ref: '#/components/schemas/Credential'
                  secret:
                    type: string
                    description: Shown once
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A retry of a credential that was already issued. Its secret is not shown again; revoke it and issue another.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /credentials/{credentialId}:
    parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      operationId: revokeCredential
      summary: Revoke a credential; it stops working at once
      tags:
        - credentials
      x-actors:
        - adult
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /credential:
    get:
      operationId: getOwnCredential
      summary: The calling service or assistant credential
      tags:
        - credentials
      x-actors:
        - service
        - assistant
      x-scopes: []
      responses:
        '200':
          description: The credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /live:
    get:
      operationId: openLive
      summary: Live updates (WebSocket)
      description: |
        A same-origin WebSocket that tells the client what to refetch. The server only sends; each
        message is `{"topic": "...", "childId": "..."}` (childId when the change is about one
        child), or `{"topic": "resync"}` when the server may have missed changes and the client
        should refetch everything. Messages carry no names or values. Topics: resync, household,
        children, credentials, today, tv, calendar, meals, dashboard.

        A cookie-authenticated upgrade must carry an Origin equal to the app's own origin; the
        library's own same-host check stays on as well. The credential is checked again every
        60 seconds, and the socket closes when it is revoked or expires. A display receives only
        topics its display scopes cover.
      tags:
        - live
      x-actors:
        - adult
        - phone
        - display
      x-display-scopes:
        - today
      responses:
        '101':
          description: Switched to the WebSocket protocol
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          description: Not a WebSocket upgrade request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
    display:
      type: apiKey
      in: cookie
      name: __Host-display
    bearer:
      type: http
      scheme: bearer
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable, machine-readable, snake_case
          examples:
            - not_found
        message:
          type: string
          description: Safe to show to the user; never contains internals
    Error:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    Id:
      type: string
      format: uuid
    Household:
      type: object
      required:
        - id
        - name
        - timeZone
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        timeZone:
          type: string
          description: IANA zone name; the household day follows it
          examples:
            - Europe/Amsterdam
    Me:
      type: object
      required:
        - adult
        - household
      properties:
        adult:
          type: object
          required:
            - id
            - email
            - name
          properties:
            id:
              $ref: '#/components/schemas/Id'
            email:
              type: string
            name:
              type: string
        household:
          $ref: '#/components/schemas/Household'
    Child:
      type: object
      required:
        - id
        - name
        - archived
        - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        archived:
          type: boolean
        version:
          type: integer
    ChildName:
      type: string
      minLength: 1
      maxLength: 40
      pattern: \S
    Credential:
      type: object
      required:
        - id
        - kind
        - name
        - scopes
        - allChildren
        - childIds
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
            - service
            - assistant
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        allChildren:
          type: boolean
        childIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request does not match the contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No live credential. The same response for every authentication failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: The request body is over the operation's limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited; retry after the Retry-After header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: This caller may not do this, including any cross-origin unsafe request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The resource changed, or already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: This Idempotency-Key was already used for a different request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource for this caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    SetSession:
      description: Sets or clears the __Host-session cookie
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every state change. A retry with the same key, from the same caller with the
        same body, gets the first answer (for 30 days) instead of doing it again.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
