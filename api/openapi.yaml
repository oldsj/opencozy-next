openapi: 3.1.0
info:
  title: OpenCozy API
  version: 0.1.0
  description: |
    The wire contract for every OpenCozy client. Each domain's operations live in their own file
    in api/src/; `make gen` bundles them into api/openapi.yaml, and the Go server (internal/api)
    and the TypeScript client (web/src/api/schema.gen.ts) are generated from that.

    **Who may call what** is declared on each operation, and the declaration is the check
    (internal/authz): `x-actors` lists the actor kinds allowed (`public` for none needed),
    `x-scopes` the scopes a service or assistant credential needs, `x-display-scopes` the scopes
    a wall display needs, `x-child-param` the path parameter naming a child, `x-recent-auth` an
    adult sign-in within 10 minutes, and `x-body-limit` the body cap in bytes (default 64 KiB).
    An operation without `x-actors` is refused and stops the server from starting.

    Credentials: the adult web session is the `__Host-session` cookie, a wall display the
    `__Host-display` cookie; parent phones (`ocp_`), service credentials (`ocz_`) and assistants
    (`oca_`) send `Authorization: Bearer`. Every authentication failure is the same 401.
    Cross-site state-changing requests with cookies are refused by Go's `http.CrossOriginProtection`.
servers:
  - url: /api
tags:
  - name: auth
    description: Adult sign-in
  - name: household
    description: The caller's household
  - name: children
    description: Children of the household
  - name: credentials
    description: Service and assistant credentials
  - name: live
    description: Live updates over a WebSocket
  - name: meals
    description: Recipes and the meal plan
  - name: calendar
    description: Followed calendars, their events, and who they are for
paths:
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags:
        - auth
      x-actors:
        - public
      x-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: adult@example.test
              password: a long enough password
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out and end the session
      tags:
        - auth
      x-actors:
        - public
      x-body-limit: 1
      responses:
        '204':
          description: Signed out (also when there was no session)
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in adult and their household
      tags:
        - auth
      x-actors:
        - adult
      responses:
        '200':
          description: The signed-in adult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /auth/confirm:
    post:
      operationId: confirmSignIn
      summary: Enter the password again, for operations that need a recent sign-in
      tags:
        - auth
      x-actors:
        - adult
      x-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
            example:
              password: a long enough password
      responses:
        '204':
          description: Confirmed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkey/options:
    post:
      operationId: passkeySignInOptions
      summary: Start signing in with a passkey
      tags:
        - auth
      x-actors:
        - public
      responses:
        '200':
          description: Options for navigator.credentials.get
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkey:
    post:
      operationId: passkeySignIn
      summary: Sign in with a passkey
      tags:
        - auth
      x-actors:
        - public
      x-body-limit: 16384
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
            example:
              challengeId: 0195f2d4-0000-7000-8000-000000000000
              credential: {}
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkey/confirm/options:
    post:
      operationId: passkeyConfirmOptions
      summary: Start confirming this sign-in with one of your passkeys
      tags:
        - auth
      x-actors:
        - adult
      responses:
        '200':
          description: Options for navigator.credentials.get
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkey/confirm:
    post:
      operationId: passkeyConfirm
      summary: Confirm this sign-in with a passkey, for operations that need a recent sign-in
      tags:
        - auth
      x-actors:
        - adult
      x-body-limit: 16384
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyResponse'
            example:
              challengeId: 0195f2d4-0000-7000-8000-000000000000
              credential: {}
      responses:
        '204':
          description: Confirmed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkeys:
    get:
      operationId: listPasskeys
      summary: Your passkeys
      tags:
        - auth
      x-actors:
        - adult
      responses:
        '200':
          description: Your passkeys, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkeys'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addPasskey
      summary: Add a passkey
      tags:
        - auth
      x-actors:
        - adult
      x-recent-auth: true
      x-body-limit: 16384
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPasskey'
            example:
              challengeId: 0195f2d4-0000-7000-8000-000000000000
              name: Laptop
              credential: {}
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkeys/options:
    post:
      operationId: passkeyRegistrationOptions
      summary: Start adding a passkey
      tags:
        - auth
      x-actors:
        - adult
      x-recent-auth: true
      responses:
        '200':
          description: Options for navigator.credentials.create
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /auth/passkeys/{passkeyId}:
    parameters:
      - name: passkeyId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      operationId: removePasskey
      summary: Remove a passkey; it stops working at once
      tags:
        - auth
      x-actors:
        - adult
      x-recent-auth: true
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
  /household:
    get:
      operationId: getHousehold
      summary: The caller's household
      tags:
        - household
      x-actors:
        - adult
        - phone
        - display
        - service
        - assistant
      x-scopes:
        - household:read
      x-display-scopes:
        - today
      responses:
        '200':
          description: The household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /children:
    get:
      operationId: listChildren
      summary: The children the caller may act for
      tags:
        - children
      x-actors:
        - adult
        - phone
        - display
        - service
        - assistant
      x-scopes:
        - children:read
      x-display-scopes:
        - today
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Children, oldest first
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChild
      summary: Add a child
      tags:
        - children
      x-actors:
        - adult
        - phone
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-body-limit: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  $ref: '#/components/schemas/ChildName'
                color:
                  $ref: '#/components/schemas/ProfileColor'
            example:
              name: Robin
              color: sage
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /children/{childId}:
    parameters:
      - name: childId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getChild
      summary: One child
      tags:
        - children
      x-actors:
        - adult
        - phone
        - display
        - service
        - assistant
      x-scopes:
        - children:read
      x-display-scopes:
        - today
      x-child-param: childId
      responses:
        '200':
          description: The child
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateChild
      summary: Rename a child, or archive or restore them
      tags:
        - children
      x-actors:
        - adult
        - phone
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-child-param: childId
      x-body-limit: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - archived
                - expectedVersion
              properties:
                name:
                  $ref: '#/components/schemas/ChildName'
                archived:
                  type: boolean
                expectedVersion:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
            example:
              name: Robin
              archived: false
              expectedVersion: 1
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /credentials:
    get:
      operationId: listCredentials
      summary: The household's live service and assistant credentials
      tags:
        - credentials
      x-actors:
        - adult
      responses:
        '200':
          description: Credentials, oldest first; secrets are never shown again
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCredential
      summary: Issue a service or assistant credential
      description: Needs a sign-in within the last 10 minutes. The secret is in this response only.
      tags:
        - credentials
      x-actors:
        - adult
      x-command: true
      x-record-response: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-recent-auth: true
      x-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - kind
                - name
                - scopes
              properties:
                kind:
                  type: string
                  enum:
                    - service
                    - assistant
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 32
                  uniqueItems: true
                  items:
                    type: string
                    maxLength: 64
                allChildren:
                  type: boolean
                  default: false
                childIds:
                  type: array
                  maxItems: 50
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Id'
            example:
              kind: service
              name: Router
              scopes:
                - children:read
              allChildren: true
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                type: object
                required:
                  - credential
                  - secret
                properties:
                  credential:
                    $ref: '#/components/schemas/Credential'
                  secret:
                    type: string
                    description: Shown once
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A retry of a credential that was already issued. Its secret is not shown again; revoke it and issue another.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /credentials/{credentialId}:
    parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      operationId: revokeCredential
      summary: Revoke a credential; it stops working at once
      tags:
        - credentials
      x-actors:
        - adult
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /credential:
    get:
      operationId: getOwnCredential
      summary: The calling service or assistant credential
      tags:
        - credentials
      x-actors:
        - service
        - assistant
      x-scopes: []
      responses:
        '200':
          description: The credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /display/pairings:
    post:
      operationId: startDisplayPairing
      summary: A wall display asks to be paired
      description: |
        Returns a code for the display to show, and sets a pairing cookie that only this display
        holds. An adult enters the code (createDisplay); the display then claims its session
        (claimDisplayPairing). The code lasts 10 minutes.
      tags:
        - displays
      x-actors:
        - public
      x-body-limit: 1
      responses:
        '201':
          description: The pairing code to show
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pairing'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Too many pairings are open; try again in a few minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /display/pairings/claim:
    post:
      operationId: claimDisplayPairing
      summary: A wall display collects its session once an adult has entered its code
      tags:
        - displays
      x-actors:
        - public
      x-body-limit: 1
      parameters:
        - name: __Host-display-pairing
          in: cookie
          required: false
          description: Set by startDisplayPairing
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Paired. The display cookie is set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Display'
        '202':
          description: Not yet; ask again in a few seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingWait'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /displays:
    get:
      operationId: listDisplays
      summary: The household's paired wall displays
      tags:
        - displays
      x-actors:
        - adult
      responses:
        '200':
          description: The displays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Display'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createDisplay
      summary: Pair the wall display showing this code
      description: Needs a sign-in within the last 10 minutes.
      tags:
        - displays
      x-actors:
        - adult
      x-recent-auth: true
      x-command: true
      x-body-limit: 4096
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDisplay'
            example:
              code: K7MXQ2
              name: Kitchen
              scopes:
                - today
      responses:
        '201':
          description: Paired; the display picks up its session within seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Display'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /displays/{displayId}:
    delete:
      operationId: revokeDisplay
      summary: Unpair a wall display; it stops working at once
      tags:
        - displays
      x-actors:
        - adult
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: displayId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: Unpaired
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /today:
    get:
      operationId: getToday
      summary: Today for every child, as the wall display shows it
      tags:
        - today
      x-actors:
        - adult
        - phone
        - display
      x-display-scopes:
        - today
      responses:
        '200':
          description: Today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Today'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
