      x-body-limit: 1024
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwardRuleEdit'
            example:
              activityKey: build_house
              points: 5
              dailyLimit: 25
              archived: false
              expectedVersion: 1
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version_conflict (changed meanwhile), rule_archived, or rule_exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Error'
  /learning/links:
    get:
      operationId: listLearningLinks
      summary: Children's linked learning-app accounts
      tags:
        - learning
      x-actors:
        - adult
        - phone
      responses:
        '200':
          description: Live links of live children
          content:
            application/json:
              schema:
                type: object
                required:
                  - links
                properties:
                  links:
                    type: array
                    maxItems: 500
                    items:
                      $ref: '#/components/schemas/LearningLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: linkLearner
      summary: Link a child to their learning-app account
      tags:
        - learning
      x-actors:
        - adult
        - phone
      x-command: true
      x-body-limit: 1024
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLearningLink'
            example:
              childId: 0190a1b2-0000-7000-8000-000000000001
              provider: minecraft
              externalId: Builder_42
      responses:
        '201':
          description: Linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: link_exists, the account is linked to a child already
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Error'
  /learning/links/{linkId}:
    parameters:
      - name: linkId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      operationId: unlinkLearner
      summary: Unlink an account; its awards stay
      tags:
        - learning
      x-actors:
        - adult
        - phone
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Unlinked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /learning/awards:
    post:
      operationId: awardLearning
      summary: Award points for a learning activity
      description: 'For a learning app''s service credential. The linked account picks the child, and the live rule for the activity sets the points, up to the rule''s daily limit per child (household day). Each sourceEventId pays at most once, forever: sending it again with the same account and activity returns the award (200); with anything else, 409. Send the same UUID as the Idempotency-Key.'
      tags:
        - learning
      x-actors:
        - service
      x-scopes:
        - learning:award
      x-command: true
      x-body-limit: 1024
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningActivity'
            example:
              sourceEventId: 0190a1b2-0000-7000-8000-0000000000aa
              externalId: Builder_42
              activityKey: build_house
      responses:
        '200':
          description: Already awarded for this event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningAward'
        '201':
          description: Awarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningAward'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The credential may not act for this child or award with this rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_learner (no live link) or unknown_activity (no live rule)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: daily_limit_reached, child_archived, or event_reused (this event was awarded for another account or activity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
    display:
      type: apiKey
      in: cookie
      name: __Host-display
    device:
      type: apiKey
      in: header
      name: X-OpenCozy-Signature
      description: Signed device request; see the API description
    deviceWeb:
      type: apiKey
      in: cookie
      name: __Host-device
    bearer:
      type: http
      scheme: bearer
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable, machine-readable, snake_case
          examples:
            - not_found
        message:
          type: string
          description: Safe to show to the user; never contains internals
    Error:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    Id:
      type: string
      format: uuid
    Version:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: Counts saves; send it back as expectedVersion to save over exactly this one
    Household:
      type: object
      required:
        - id
        - name
        - timeZone
        - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        timeZone:
          type: string
          description: IANA zone name; the household day follows it
          examples:
            - Europe/Amsterdam
        version:
          $ref: '#/components/schemas/Version'
    Me:
      type: object
      required:
        - adult
        - household
      properties:
        adult:
          type: object
          required:
            - id
            - email
            - name
          properties:
            id:
              $ref: '#/components/schemas/Id'
            email:
              type: string
            name:
              type: string
        household:
          $ref: '#/components/schemas/Household'
    OidcProvider:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
    SignInMethods:
      type: object
      additionalProperties: false
      required:
        - passkeys
        - oidc
      properties:
        passkeys:
          type: boolean
          description: Passkeys are set up on this server (WEBAUTHN_RP_ID)
        oidc:
          description: The single sign-on provider's button name ("Sign in with <name>"), or null when it isn't set up
          oneOf:
            - $ref: '#/components/schemas/OidcProvider'
            - type: 'null'
    OidcLink:
      type: object
      additionalProperties: false
      required:
        - email
        - linkedAt
      properties:
        email:
          type: string
          description: The email the provider confirmed when the link was made
        linkedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    PasskeyOptions:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - options
      properties:
        challengeId:
          $ref: '#/components/schemas/Id'
        options:
          type: object
          additionalProperties: true
          description: PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON
    PasskeyResponse:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - credential
      properties:
        challengeId:
          $ref: '#/components/schemas/Id'
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential.toJSON()
    Passkey:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - createdAt
        - backedUp
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        backedUp:
          type: boolean
          description: Synced to a password manager or cloud keychain, so it survives losing the device.
    Passkeys:
      type: object
      additionalProperties: false
      required:
        - passkeys
      properties:
        passkeys:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Passkey'
    NewPasskey:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - name
        - credential
      properties:
        challengeId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 80
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential.toJSON()
    ProfileColor:
      type: string
      enum:
        - rose
        - sage
        - sky
        - butter
        - lilac
        - peach
        - teal
        - sand
    Child:
      type: object
      required:
        - id
        - name
        - color
        - archived
        - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        color:
          $ref: '#/components/schemas/ProfileColor'
        archived:
          type: boolean
        version:
          type: integer
    ChildName:
      type: string
      minLength: 1
      maxLength: 40
      pattern: \S
    Credential:
      type: object
      required:
        - id
        - kind
        - name
        - scopes
        - allChildren
        - childIds
        - awardRuleIds
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
            - service
            - assistant
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        allChildren:
          type: boolean
        childIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        awardRuleIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Pairing:
      type: object
      required:
        - code
        - expiresAt
      properties:
        code:
          type: string
          description: Six letters and digits, without 0, O, 1, I or L
          examples:
            - K7MXQ2
        expiresAt:
          type: string
          format: date-time
    DisplayScope:
      type: string
      enum:
        - today
        - tv
        - calendar
        - meals
        - dashboard
    Display:
      type: object
      required:
        - id
        - name
        - scopes
        - createdAt
        - expiresAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/DisplayScope'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    PairingWait:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - waiting
    NewDisplay:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - scopes
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 16
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DisplayScope'
    DeviceName:
      type: string
      minLength: 1
      maxLength: 80
    Platform:
      type: string
      enum:
        - ios
        - android
    DeviceChild:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - color
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        color:
          $ref: '#/components/schemas/ProfileColor'
    Device:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - platform
        - child
        - pairedAt
      description: |
        `child` is null when the device's child was archived. Such a device can't act (its signed requests get 401) until an adult gives it to another child.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          $ref: '#/components/schemas/DeviceName'
        platform:
          $ref: '#/components/schemas/Platform'
        child:
          oneOf:
            - $ref: '#/components/schemas/DeviceChild'
            - type: 'null'
        pairedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    LockMessage:
      type: string
      minLength: 1
      maxLength: 200
      description: Shown on a locked device's shield
    Devices:
      type: object
      additionalProperties: false
      required:
        - devices
        - lockMessage
        - defaultLockMessage
      properties:
        devices:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Device'
        lockMessage:
          description: The household's own message; null means the default
          oneOf:
            - $ref: '#/components/schemas/LockMessage'
            - type: 'null'
        defaultLockMessage:
          $ref: '#/components/schemas/LockMessage'
    DevicePairingOffer:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - token
        - qrPayload
        - qrModules
        - expiresAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          description: Eight characters as XXXX-XXXX, from an alphabet without look-alikes
          examples:
            - ABCD-EF23
        token:
          type: string
          description: 43 characters, base64url
        qrPayload:
          type: string
          description: opencozy-pair:v1?origin=<url-encoded origin>&token=<token>
        qrModules:
          type: array
          description: The QR code of qrPayload (error correction M), row by row; "1" is a dark module
          maxItems: 177
          items:
            type: string
            pattern: ^[01]+$
            maxLength: 177
        expiresAt:
          type: string
          format: date-time
    DeviceHousehold:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - timeZone
        - lockMessage
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        timeZone:
          type: string
          description: IANA zone name; the household day follows it
        lockMessage:
          description: The message to show; the default when the household has none
          $ref: '#/components/schemas/LockMessage'
    DeviceSelf:
      type: object
      additionalProperties: false
      required:
        - device
        - household
        - serverTime
      properties:
        device:
          $ref: '#/components/schemas/Device'
        household:
          $ref: '#/components/schemas/DeviceHousehold'
        serverTime:
          type: string
          format: date-time
    DevicePairRequest:
      type: object
      additionalProperties: false
      required:
        - publicKey
        - proof
        - platform
        - name
      properties:
        token:
          type: string
          maxLength: 64
        code:
          type: string
          maxLength: 16
        publicKey:
          type: string
          maxLength: 100
          description: The 65-byte uncompressed P-256 point (X9.63), standard base64
        proof:
          type: string
          pattern: ^[A-Za-z0-9_-]{86}$
        platform:
          $ref: '#/components/schemas/Platform'
        name:
          $ref: '#/components/schemas/DeviceName'
    TodayItem:
      type: object
      required:
        - id
        - title
        - state
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        points:
          type: integer
        state:
          type: string
          enum:
            - open
            - pending
            - complete
        rejectedReason:
          type: string
          maxLength: 200
    TodayGroup:
      type: object
      required:
        - id
        - kind
        - title
        - done
        - pending
        - items
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
            - routine
            - chores
        title:
          type: string
        status:
          type: string
          description: A short note, such as "3 points"
        done:
          type: boolean
        pending:
          type: boolean
          description: Finished, waiting for an adult's approval
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodayItem'
    TodayChild:
      type: object
      required:
        - child
        - groups
      properties:
        child:
          type: object
          required:
            - id
            - name
            - color
            - points
            - earnedToday
            - completed
            - total
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
              type: string
            color:
              $ref: '#/components/schemas/ProfileColor'
            points:
              type: integer
              format: int64
            earnedToday:
              type: integer
              format: int64
            completed:
              type: integer
            total:
              type: integer
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TodayGroup'
    Today:
      type: object
      required:
        - children
        - householdDay
        - serverTime
      properties:
        householdDay:
          type: string
          format: date
        serverTime:
          type: string
          format: date-time
        children:
          type: array
          items:
            $ref: '#/components/schemas/TodayChild'
    HistoryEntry:
      type: object
      required:
        - id
        - at
        - kind
        - title
        - points
      properties:
        id:
          $ref: '#/components/schemas/Id'
        at:
          type: string
          format: date-time
        kind:
          type: string
          enum:
            - earned
            - reversed
            - redeemed
            - refunded
        title:
          type: string
        points:
          type: integer
          description: Signed; negative takes points away
        reason:
          type: string
        reversedBy:
          $ref: '#/components/schemas/Id'
        reverses:
          $ref: '#/components/schemas/Id'
        by:
          type: string
          description: The adult who decided it, by name
    History:
      type: object
      required:
        - balance
        - entries
      properties:
        balance:
          type: integer
          format: int64
        entries:
          type: array
          description: The newest 200
          items:
            $ref: '#/components/schemas/HistoryEntry'
    Target:
      type: string
      enum:
        - ipad
        - tv
      description: Which screen the minutes are for (ipad when absent)
    Reward:
      type: object
      required:
        - id
        - title
        - cost
        - kind
        - available
        - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        cost:
          type: integer
        kind:
          type: string
          enum:
            - item
            - screen_time
        minutes:
          type: integer
        target:
          $ref: '#/components/schemas/Target'
          description: For screen_time, which screen
        available:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'
    Rewards:
      type: object
      required:
        - rewards
      properties:
        rewards:
          type: array
          items:
            $ref: '#/components/schemas/Reward'
    Title:
      type: string
      minLength: 1
      maxLength: 80
      pattern: \S
    NewReward:
      type: object
      additionalProperties: false
      required:
        - title
        - cost
        - kind
      properties:
        title:
          $ref: '#/components/schemas/Title'
        cost:
          type: integer
          minimum: 1
          maximum: 100000
        kind:
          type: string
          enum:
            - item
            - screen_time
        minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Required for screen_time, refused otherwise
        target:
          $ref: '#/components/schemas/Target'
          description: For screen_time, which screen (ipad when absent); refused otherwise
    RewardEdit:
      type: object
      additionalProperties: false
      required:
        - title
        - cost
        - kind
        - available
        - expectedVersion
      properties:
        title:
          $ref: '#/components/schemas/Title'
        cost:
          type: integer
          minimum: 1
          maximum: 100000
        kind:
          type: string
          enum:
            - item
            - screen_time
        minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Required for screen_time, refused otherwise
        target:
          $ref: '#/components/schemas/Target'
          description: For screen_time, which screen (unchanged when absent); refused otherwise
        available:
          type: boolean
          description: false hides it from children
        expectedVersion:
          $ref: '#/components/schemas/Version'
    RedemptionStatus:
      type: string
      enum:
        - pending
        - approved
        - fulfilled
        - rejected
        - cancelled
    Redemption:
      type: object
      required:
        - id
        - status
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/RedemptionStatus'
    RedemptionChild:
      type: object
      required:
        - id
        - name
        - color
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        color:
          $ref: '#/components/schemas/ProfileColor'
    RedemptionRow:
      type: object
      description: A redemption as an adult sees it. approved is waiting to be given; fulfilled has been given.
      required:
        - id
        - child
        - title
        - cost
        - status
        - requestedAt
        - refundedPoints
        - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        child:
          $ref: '#/components/schemas/RedemptionChild'
        title:
          type: string
        cost:
          type: integer
        status:
          $ref: '#/components/schemas/RedemptionStatus'
        requestedAt:
          type: string
          format: date-time
        fulfilledAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        minutes:
          type: integer
          description: Screen time bought
        target:
          $ref: '#/components/schemas/Target'
          description: For screen time, which screen
        usedMinutes:
          type: integer
          description: iPad time used so far, rounded up
        refundedPoints:
          type: integer
          description: Points given back (a rejection or a cancellation)
        version:
          $ref: '#/components/schemas/Version'
    InboxItem:
      type: object
      required:
        - id
        - kind
        - child
        - title
        - submittedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
