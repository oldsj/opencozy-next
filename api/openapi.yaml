openapi: 3.1.0
info:
  title: OpenCozy API
  version: 0.1.0
  description: |
    The wire contract for every OpenCozy client. Each domain's operations live in their own file
    in api/src/; `make gen` bundles them into api/openapi.yaml, and the Go server (internal/api)
    and the TypeScript client (web/src/api/schema.gen.ts) are generated from that.

    **Who may call what** is declared on each operation, and the declaration is the check
    (internal/authz): `x-actors` lists the actor kinds allowed (`public` for none needed),
    `x-scopes` the scopes a service or assistant credential needs, `x-display-scopes` the scopes
    a wall display needs, `x-child-param` the path parameter naming a child, `x-recent-auth` an
    adult sign-in within 10 minutes, and `x-body-limit` the body cap in bytes (default 64 KiB).
    An operation without `x-actors` is refused and stops the server from starting.

    Credentials: the adult web session is the `__Host-session` cookie, a wall display the
    `__Host-display` cookie; parent phones (`ocp_`), service credentials (`ocz_`) and assistants
    (`oca_`) send `Authorization: Bearer`. Every authentication failure is the same 401.
    Cross-site state-changing requests with cookies are refused by Go's `http.CrossOriginProtection`.
servers:
  - url: /api
tags:
  - name: auth
    description: Adult sign-in
  - name: household
    description: The caller's household
  - name: children
    description: Children of the household
  - name: credentials
    description: Service and assistant credentials
  - name: live
    description: Live updates over a WebSocket
paths:
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags:
        - auth
      x-actors:
        - public
      x-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: adult@example.test
              password: a long enough password
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      operationId: logout
      summary: Sign out and end the session
      tags:
        - auth
      x-actors:
        - public
      x-body-limit: 1
      responses:
        '204':
          description: Signed out (also when there was no session)
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      operationId: getMe
      summary: The signed-in adult and their household
      tags:
        - auth
      x-actors:
        - adult
      responses:
        '200':
          description: The signed-in adult
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /auth/confirm:
    post:
      operationId: confirmSignIn
      summary: Enter the password again, for operations that need a recent sign-in
      tags:
        - auth
      x-actors:
        - adult
      x-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
            example:
              password: a long enough password
      responses:
        '204':
          description: Confirmed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /household:
    get:
      operationId: getHousehold
      summary: The caller's household
      tags:
        - household
      x-actors:
        - adult
        - phone
        - display
        - service
        - assistant
      x-scopes:
        - household:read
      x-display-scopes:
        - today
      responses:
        '200':
          description: The household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /children:
    get:
      operationId: listChildren
      summary: The children the caller may act for
      tags:
        - children
      x-actors:
        - adult
        - phone
        - display
        - service
        - assistant
      x-scopes:
        - children:read
      x-display-scopes:
        - today
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Children, oldest first
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChild
      summary: Add a child
      tags:
        - children
      x-actors:
        - adult
        - phone
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-body-limit: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  $ref: '#/components/schemas/ChildName'
                color:
                  $ref: '#/components/schemas/ProfileColor'
            example:
              name: Robin
              color: sage
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /children/{childId}:
    parameters:
      - name: childId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getChild
      summary: One child
      tags:
        - children
      x-actors:
        - adult
        - phone
        - display
        - service
        - assistant
      x-scopes:
        - children:read
      x-display-scopes:
        - today
      x-child-param: childId
      responses:
        '200':
          description: The child
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateChild
      summary: Rename a child, or archive or restore them
      tags:
        - children
      x-actors:
        - adult
        - phone
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-child-param: childId
      x-body-limit: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - archived
                - expectedVersion
              properties:
                name:
                  $ref: '#/components/schemas/ChildName'
                archived:
                  type: boolean
                expectedVersion:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
            example:
              name: Robin
              archived: false
              expectedVersion: 1
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Child'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /credentials:
    get:
      operationId: listCredentials
      summary: The household's live service and assistant credentials
      tags:
        - credentials
      x-actors:
        - adult
      responses:
        '200':
          description: Credentials, oldest first; secrets are never shown again
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCredential
      summary: Issue a service or assistant credential
      description: Needs a sign-in within the last 10 minutes. The secret is in this response only.
      tags:
        - credentials
      x-actors:
        - adult
      x-command: true
      x-record-response: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-recent-auth: true
      x-body-limit: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - kind
                - name
                - scopes
              properties:
                kind:
                  type: string
                  enum:
                    - service
                    - assistant
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 32
                  uniqueItems: true
                  items:
                    type: string
                    maxLength: 64
                allChildren:
                  type: boolean
                  default: false
                childIds:
                  type: array
                  maxItems: 50
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Id'
            example:
              kind: service
              name: Router
              scopes:
                - children:read
              allChildren: true
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema:
                type: object
                required:
                  - credential
                  - secret
                properties:
                  credential:
                    $ref: '#/components/schemas/Credential'
                  secret:
                    type: string
                    description: Shown once
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A retry of a credential that was already issued. Its secret is not shown again; revoke it and issue another.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /credentials/{credentialId}:
    parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      operationId: revokeCredential
      summary: Revoke a credential; it stops working at once
      tags:
        - credentials
      x-actors:
        - adult
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /credential:
    get:
      operationId: getOwnCredential
      summary: The calling service or assistant credential
      tags:
        - credentials
      x-actors:
        - service
        - assistant
      x-scopes: []
      responses:
        '200':
          description: The credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /display/pairings:
    post:
      operationId: startDisplayPairing
      summary: A wall display asks to be paired
      description: |
        Returns a code for the display to show, and sets a pairing cookie that only this display
        holds. An adult enters the code (createDisplay); the display then claims its session
        (claimDisplayPairing). The code lasts 10 minutes.
      tags:
        - displays
      x-actors:
        - public
      x-body-limit: 1
      responses:
        '201':
          description: The pairing code to show
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pairing'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Too many pairings are open; try again in a few minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
  /display/pairings/claim:
    post:
      operationId: claimDisplayPairing
      summary: A wall display collects its session once an adult has entered its code
      tags:
        - displays
      x-actors:
        - public
      x-body-limit: 1
      parameters:
        - name: __Host-display-pairing
          in: cookie
          required: false
          description: Set by startDisplayPairing
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Paired. The display cookie is set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Display'
        '202':
          description: Not yet; ask again in a few seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingWait'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'
  /displays:
    get:
      operationId: listDisplays
      summary: The household's paired wall displays
      tags:
        - displays
      x-actors:
        - adult
      responses:
        '200':
          description: The displays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Display'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createDisplay
      summary: Pair the wall display showing this code
      description: Needs a sign-in within the last 10 minutes.
      tags:
        - displays
      x-actors:
        - adult
      x-recent-auth: true
      x-command: true
      x-body-limit: 4096
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDisplay'
            example:
              code: K7MXQ2
              name: Kitchen
              scopes:
                - today
      responses:
        '201':
          description: Paired; the display picks up its session within seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Display'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /displays/{displayId}:
    delete:
      operationId: revokeDisplay
      summary: Unpair a wall display; it stops working at once
      tags:
        - displays
      x-actors:
        - adult
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: displayId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: Unpaired
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /today:
    get:
      operationId: getToday
      summary: Today for every child, as the wall display shows it
      tags:
        - today
      x-actors:
        - adult
        - phone
        - display
      x-display-scopes:
        - today
      responses:
        '200':
          description: Today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Today'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /today/chores/{choreId}/complete:
    post:
      operationId: completeChore
      summary: Mark today's chore done; it waits for an adult's approval
      tags:
        - today
      x-actors:
        - adult
        - phone
        - display
      x-display-scopes:
        - today
      x-command: true
      x-body-limit: 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: choreId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Done, waiting for approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /today/routines/{routineId}/steps/{stepId}/check:
    post:
      operationId: checkRoutineStep
      summary: Tick a step of today's routine; the last one sends the routine for approval
      tags:
        - today
      x-actors:
        - adult
        - phone
        - display
      x-display-scopes:
        - today
      x-command: true
      x-body-limit: 1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: routineId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: stepId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Ticked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayGroup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /inbox:
    get:
      operationId: getInbox
      summary: What waits for an adult's decision, oldest first
      tags:
        - inbox
      x-actors:
        - adult
        - phone
      responses:
        '200':
          description: The inbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
  /inbox/{itemId}/approve:
    post:
      operationId: approveInboxItem
      summary: Say yes; a completion's points land
      tags:
        - inbox
      x-actors:
        - adult
        - phone
      x-command: true
      x-body-limit: 64
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /inbox/{itemId}/reject:
    post:
      operationId: rejectInboxItem
      summary: Send it back, with an optional reason the child sees
      tags:
        - inbox
      x-actors:
        - adult
        - phone
      x-command: true
      x-body-limit: 1024
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 200
                  pattern: \S
            example:
              reason: The bed still needs making.
      responses:
        '200':
          description: Sent back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /chores:
    get:
      operationId: listChores
      summary: The household's chores
      tags:
        - chores
      x-actors:
        - adult
        - phone
      responses:
        '200':
          description: The chores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createChore
      summary: Add a chore for a child
      tags:
        - chores
      x-actors:
        - adult
        - phone
      x-command: true
      x-body-limit: 2048
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewChore'
            example:
              childId: 0190f0e0-0000-7000-8000-000000000001
              title: Feed the cat
              points: 4
              days:
                - 1
                - 2
                - 3
                - 4
                - 5
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /chores/{choreId}:
    delete:
      operationId: archiveChore
      summary: Remove a chore from now on (history stays)
      tags:
        - chores
      x-actors:
        - adult
        - phone
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: choreId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /routines:
    get:
      operationId: listRoutines
      summary: The household's routines
      tags:
        - chores
      x-actors:
        - adult
        - phone
      responses:
        '200':
          description: The routines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Routine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createRoutine
      summary: Add a routine (a list of steps, approved as one) for a child
      tags:
        - chores
      x-actors:
        - adult
        - phone
      x-command: true
      x-body-limit: 8192
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRoutine'
            example:
              childId: 0190f0e0-0000-7000-8000-000000000001
              title: Morning
              points: 3
              steps:
                - Make the bed
                - Brush teeth
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Routine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /routines/{routineId}:
    delete:
      operationId: archiveRoutine
      summary: Remove a routine from now on (history stays)
      tags:
        - chores
      x-actors:
        - adult
        - phone
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: routineId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /live:
    get:
      operationId: openLive
      summary: Live updates (WebSocket)
      description: |
        A same-origin WebSocket that tells the client what to refetch. The server only sends; each
        message is `{"topic": "...", "childId": "..."}` (childId when the change is about one
        child), or `{"topic": "resync"}` when the server may have missed changes and the client
        should refetch everything. Messages carry no names or values. Topics: resync, household,
        children, credentials, today, tv, calendar, meals, dashboard.

        A cookie-authenticated upgrade must carry an Origin equal to the app's own origin; the
        library's own same-host check stays on as well. The credential is checked again every
        60 seconds, and the socket closes when it is revoked or expires. A display receives only
        topics its display scopes cover.
      tags:
        - live
      x-actors:
        - adult
        - phone
        - display
      x-display-scopes:
        - today
      responses:
        '101':
          description: Switched to the WebSocket protocol
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '426':
          description: Not a WebSocket upgrade request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
    display:
      type: apiKey
      in: cookie
      name: __Host-display
    bearer:
      type: http
      scheme: bearer
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable, machine-readable, snake_case
          examples:
            - not_found
        message:
          type: string
          description: Safe to show to the user; never contains internals
    Error:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    Id:
      type: string
      format: uuid
    Household:
      type: object
      required:
        - id
        - name
        - timeZone
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        timeZone:
          type: string
          description: IANA zone name; the household day follows it
          examples:
            - Europe/Amsterdam
    Me:
      type: object
      required:
        - adult
        - household
      properties:
        adult:
          type: object
          required:
            - id
            - email
            - name
          properties:
            id:
              $ref: '#/components/schemas/Id'
            email:
              type: string
            name:
              type: string
        household:
          $ref: '#/components/schemas/Household'
    ProfileColor:
      type: string
      enum:
        - rose
        - sage
        - sky
        - butter
        - lilac
        - peach
        - teal
        - sand
    Child:
      type: object
      required:
        - id
        - name
        - color
        - archived
        - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        color:
          $ref: '#/components/schemas/ProfileColor'
        archived:
          type: boolean
        version:
          type: integer
    ChildName:
      type: string
      minLength: 1
      maxLength: 40
      pattern: \S
    Credential:
      type: object
      required:
        - id
        - kind
        - name
        - scopes
        - allChildren
        - childIds
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
            - service
            - assistant
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        allChildren:
          type: boolean
        childIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Pairing:
      type: object
      required:
        - code
        - expiresAt
      properties:
        code:
          type: string
          description: Six letters and digits, without 0, O, 1, I or L
          examples:
            - K7MXQ2
        expiresAt:
          type: string
          format: date-time
    DisplayScope:
      type: string
      enum:
        - today
        - tv
        - calendar
        - meals
        - dashboard
    Display:
      type: object
      required:
        - id
        - name
        - scopes
        - createdAt
        - expiresAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/DisplayScope'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    PairingWait:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - waiting
    NewDisplay:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - scopes
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 16
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DisplayScope'
    TodayItem:
      type: object
      required:
        - id
        - title
        - state
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        points:
          type: integer
        state:
          type: string
          enum:
            - open
            - pending
            - complete
        rejectedReason:
          type: string
          maxLength: 200
    TodayGroup:
      type: object
      required:
        - id
        - kind
        - title
        - done
        - pending
        - items
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
            - routine
            - chores
        title:
          type: string
        status:
          type: string
          description: A short note, such as "3 points"
        done:
          type: boolean
        pending:
          type: boolean
          description: Finished, waiting for an adult's approval
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodayItem'
    TodayChild:
      type: object
      required:
        - child
        - groups
      properties:
        child:
          type: object
          required:
            - id
            - name
            - color
            - points
            - earnedToday
            - completed
            - total
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
              type: string
            color:
              $ref: '#/components/schemas/ProfileColor'
            points:
              type: integer
              format: int64
            earnedToday:
              type: integer
              format: int64
            completed:
              type: integer
            total:
              type: integer
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TodayGroup'
    Today:
      type: object
      required:
        - children
        - householdDay
        - serverTime
      properties:
        householdDay:
          type: string
          format: date
        serverTime:
          type: string
          format: date-time
        children:
          type: array
          items:
            $ref: '#/components/schemas/TodayChild'
    InboxItem:
      type: object
      required:
        - id
        - kind
        - child
        - title
        - submittedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
            - completion
            - routine
            - redemption
            - time_request
        child:
          type: object
          required:
            - id
            - name
            - color
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
              type: string
            color:
              $ref: '#/components/schemas/ProfileColor'
        title:
          type: string
        detail:
          type: string
        points:
          type: integer
        submittedAt:
          type: string
          format: date-time
        minutesRequested:
          type: integer
    Inbox:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InboxItem'
    Decision:
      type: object
      required:
        - id
        - state
      properties:
        id:
          $ref: '#/components/schemas/Id'
        state:
          type: string
          enum:
            - approved
            - rejected
    Days:
      type: array
      description: Weekdays it is on, 0 (Sunday) to 6 (Saturday). Empty or missing means every day.
      maxItems: 7
      uniqueItems: true
      items:
        type: integer
        minimum: 0
        maximum: 6
    Chore:
      type: object
      required:
        - id
        - childId
        - title
        - points
        - days
      properties:
        id:
          $ref: '#/components/schemas/Id'
        childId:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        points:
          type: integer
        days:
          $ref: '#/components/schemas/Days'
    Title:
      type: string
      minLength: 1
      maxLength: 80
      pattern: \S
    Points:
      type: integer
      minimum: 0
      maximum: 1000
    NewChore:
      type: object
      additionalProperties: false
      required:
        - childId
        - title
        - points
      properties:
        childId:
          $ref: '#/components/schemas/Id'
        title:
          $ref: '#/components/schemas/Title'
        points:
          $ref: '#/components/schemas/Points'
        days:
          $ref: '#/components/schemas/Days'
    Routine:
      type: object
      required:
        - id
        - childId
        - title
        - points
        - days
        - steps
      properties:
        id:
          $ref: '#/components/schemas/Id'
        childId:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        points:
          type: integer
        days:
          $ref: '#/components/schemas/Days'
        steps:
          type: array
          items:
            type: object
            required:
              - id
              - title
            properties:
              id:
                $ref: '#/components/schemas/Id'
              title:
                type: string
    NewRoutine:
      type: object
      additionalProperties: false
      required:
        - childId
        - title
        - points
        - steps
      properties:
        childId:
          $ref: '#/components/schemas/Id'
        title:
          $ref: '#/components/schemas/Title'
        points:
          $ref: '#/components/schemas/Points'
        days:
          $ref: '#/components/schemas/Days'
        steps:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Title'
  responses:
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request does not match the contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No live credential. The same response for every authentication failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: The request body is over the operation's limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited; retry after the Retry-After header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: This caller may not do this, including any cross-origin unsafe request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The resource changed, or already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: This Idempotency-Key was already used for a different request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource for this caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    SetSession:
      description: Sets or clears the __Host-session cookie
      schema:
        type: string
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on every state change. A retry with the same key, from the same caller with the
        same body, gets the first answer (for 30 days) instead of doing it again.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]+$
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
