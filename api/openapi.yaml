        - tv:control
      x-command: true
      x-body-limit: 4096
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChosenTvs'
            example:
              tvIds:
                - 0190a1b2-0000-7000-8000-0000000000a1
      responses:
        '200':
          $ref: '#/components/responses/Opened'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /tvs/{tvId}:
    put:
      operationId: updateTv
      summary: Edit a TV
      description: Replaces the name, room, MACs, Home Assistant entity and open hours. A new or cleared entity forgets the TV's power. Open hours that are open now end its session at once.
      tags:
        - tvs
      x-actors:
        - adult
        - phone
        - assistant
      x-scopes:
        - tv:manage
      x-command: true
      x-body-limit: 2048
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TvId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TvEdit'
            example:
              name: Den TV
              room: Den
              macs:
                - 02:00:5e:10:00:01
              haEntityId: null
              openHours:
                start: '21:00'
                end: '07:00'
              expectedVersion: 1
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tv'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: version_conflict, mac_taken or entity_taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeTv
      summary: Remove a TV
      description: Ends its session, withdraws its prompt and forgets its MACs, so the router stops listing it at once.
      tags:
        - tvs
      x-actors:
        - adult
        - phone
        - assistant
      x-scopes:
        - tv:manage
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TvId'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /tvs/{tvId}/session:
    post:
      operationId: startTvSession
      summary: Turn a TV on for parents or a child
      description: Replaces the TV's running session and answers its prompt. A child's session spends their TV time, needs time left and their allowed hours, and ends when either runs out.
      tags:
        - tvs
      x-actors:
        - adult
        - phone
        - assistant
      x-scopes:
        - tv:control
      x-command: true
      x-body-limit: 256
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TvId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTvSession'
            example:
              watcher: child
              childId: 0190a1b2-0000-7000-8000-000000000001
      responses:
        '200':
          description: The running session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StartConflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /tvs/{tvId}/session/end:
    post:
      operationId: endTvSession
      summary: Turn a TV off now
      description: Ends its running session (parent_ended); a TV with none is left as it is.
      tags:
        - tvs
      x-actors:
        - adult
        - phone
        - assistant
      x-scopes:
        - tv:control
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TvId'
      responses:
        '200':
          description: The session that ended, if there was one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndedTvSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /tvs/{tvId}/ask:
    post:
      operationId: askForTv
      summary: Ask the parents to turn a TV on
      description: Raises "Who's watching?" (a display never starts a session itself). A TV already on or open answers on. Asking again while it is asking keeps the one prompt and, at most every two minutes, reminds the parents.
      tags:
        - tvs
      x-actors:
        - display
        - adult
        - phone
      x-display-scopes:
        - tv
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TvId'
      responses:
        '200':
          description: Where the TV stands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvAsked'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /tvs/{tvId}/done:
    post:
      operationId: doneWatching
      summary: Done watching
      description: Ends a TV's running session (done). A display or an adult ends any; a child's device only that child's own. It can only turn a TV off, never on.
      tags:
        - tvs
      x-actors:
        - display
        - device
        - device-web
        - adult
        - phone
      x-display-scopes:
        - tv
      x-command: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TvId'
      responses:
        '200':
          description: The session that ended, if there was one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndedTvSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: not_your_session (a device, and someone else is watching)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /tv-prompts/{promptId}/answer:
    post:
      operationId: answerTvPrompt
      summary: Answer "Who's watching?"
      description: 'Parents, a child (a session starts), or not now. The first answer wins: answering a prompt already answered, withdrawn or at another version is a 409.'
      tags:
        - tvs
      x-actors:
        - adult
        - phone
        - assistant
      x-scopes:
        - tv:control
      x-command: true
      x-body-limit: 256
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: promptId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TvPromptAnswer'
            example:
              expectedVersion: 1
              answer: parents
      responses:
        '200':
          description: Answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvPromptAnswered'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: already_answered, prompt_withdrawn (the TV turned off or opened), version_conflict, tv_removed, or a reason the session can't start (as for startTvSession)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /children/{childId}/tv:
    get:
      operationId: childTv
      summary: A child's TV time, as the kid view shows it
      description: Their time left and where it came from, the TVs asking "Who's watching?" now, the session they are watching, and their allowed hours.
      tags:
        - tvs
      x-actors:
        - device
        - device-web
        - adult
        - phone
      x-child-param: childId
      parameters:
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          description: The child's TV time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildTv'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /children/{childId}/tv/credits/{creditId}/forfeit:
    post:
      operationId: forfeitTvCredit
      summary: Take back the unused rest of a parent's TV grant
      description: |
        The credit keeps what was already watched; the rest leaves the child's TV time, and a session left with none ends. A reward's TV time is taken back by cancelling the reward, which refunds its points: 409 `cancel_the_reward`. 409 `nothing_left` when it is all used.
      tags:
        - tvs
      x-actors:
        - adult
        - phone
      x-child-param: childId
      x-command: true
      x-body-limit: 64
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ChildId'
        - name: creditId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
      responses:
        '200':
          description: Taken back
          content:
            application/json:
              schema:
                type: object
                required:
                  - forfeitedSeconds
                  - tv
                properties:
                  forfeitedSeconds:
                    type: integer
                  tv:
                    $ref: '#/components/schemas/ChildTv'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        default:
          $ref: '#/components/responses/Error'
  /children/{childId}/tv/watch:
    post:
      operationId: watchTv
      summary: Watch on a TV that is asking (the child's own device)
      description: The child starts their own session, spending their TV time, on a TV asking "Who's watching?" with nobody on it. It answers the prompt as a parent choosing them would.
      tags:
        - tvs
      x-actors:
        - device
        - device-web
      x-child-param: childId
      x-command: true
      x-body-limit: 256
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchTv'
            example:
              tvId: 0190a1b2-0000-7000-8000-0000000000a1
      responses:
        '200':
          description: The child's session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: not_asking (the TV isn't asking), tv_on (someone already answered), or a reason the session can't start (as for startTvSession)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /tv/allowances:
    get:
      operationId: tvAllowances
      summary: Which TV MACs may be online, and for how long (the router)
      description: 'Every MAC of a TV with a running session or that is open, with the seconds it may stay online: at most 300, so a router that loses the server closes TVs within five minutes. A session''s MACs drop out a minute before it ends (streaming apps keep playing from their buffer). Poll every few seconds.'
      tags:
        - tvs
      x-actors:
        - service
      x-scopes:
        - tv:gate
      responses:
        '200':
          description: The allowances, by MAC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvAllowances'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'
  /tv/attempts:
    post:
      operationId: reportTvAttempts
      summary: Blocked TVs trying to go online (the router)
      description: 'The router reports MACs it blocked, at most once a minute each. OpenCozy decides whether that is a TV turning on worth asking about: a TV whose Home Assistant entity has reported asks only while it says on; one without asks once it has kept trying for three minutes. After "Not now" or a session ending it stays quiet for 30 minutes unless Home Assistant sees it turn on again. Each MAC''s result: requested (a prompt was raised), pending (already asking), open (on or open), suppressed, or unknown (no TV lists it). Send a new UUID as the Idempotency-Key each time.'
      tags:
        - tvs
      x-actors:
        - service
      x-scopes:
        - tv:gate
      x-command: true
      x-body-limit: 8192
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TvAttempts'
            example:
              attempts:
                - mac: 02:00:5e:10:00:01
                  lastSeenAt: '2026-11-21T16:12:00Z'
      responses:
        '200':
          description: What OpenCozy made of each MAC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvAttemptResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
  /tv/power:
    post:
      operationId: reportTvPower
      summary: A TV's power, from Home Assistant
      description: Send the media_player's state and, when known, its last_changed. Turning on with nobody watching asks "Who's watching?"; off ends its session and withdraws its prompt; an open TV stays open either way. idle or paused unchanged for 15 minutes is unknown, not off. unavailable and unknown change nothing. Repeating a state changes nothing, so retries are safe; send a new UUID as the Idempotency-Key each time.
      tags:
        - tvs
      x-actors:
        - service
      x-scopes:
        - tv:report
      x-command: true
      x-body-limit: 1024
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TvPowerReport'
            example:
              entityId: media_player.den_tv
              state: playing
      responses:
        '200':
          description: Where the TV stands now
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvPowerResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: unknown_entity (no TV has that entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
    display:
      type: apiKey
      in: cookie
      name: __Host-display
    device:
      type: apiKey
      in: header
      name: X-OpenCozy-Signature
      description: Signed device request; see the API description
    deviceWeb:
      type: apiKey
      in: cookie
      name: __Host-device
    bearer:
      type: http
      scheme: bearer
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable, machine-readable, snake_case
          examples:
            - not_found
        message:
          type: string
          description: Safe to show to the user; never contains internals
    Error:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    Id:
      type: string
      format: uuid
    Version:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: Counts saves; send it back as expectedVersion to save over exactly this one
    Household:
      type: object
      required:
        - id
        - name
        - timeZone
        - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        timeZone:
          type: string
          description: IANA zone name; the household day follows it
          examples:
            - Europe/Amsterdam
        version:
          $ref: '#/components/schemas/Version'
    Me:
      type: object
      required:
        - adult
        - household
      properties:
        adult:
          type: object
          required:
            - id
            - email
            - name
          properties:
            id:
              $ref: '#/components/schemas/Id'
            email:
              type: string
            name:
              type: string
        household:
          $ref: '#/components/schemas/Household'
    OidcProvider:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
    SignInMethods:
      type: object
      additionalProperties: false
      required:
        - passkeys
        - oidc
      properties:
        passkeys:
          type: boolean
          description: Passkeys are set up on this server (WEBAUTHN_RP_ID)
        oidc:
          description: The single sign-on provider's button name ("Sign in with <name>"), or null when it isn't set up
          oneOf:
            - $ref: '#/components/schemas/OidcProvider'
            - type: 'null'
    OidcLink:
      type: object
      additionalProperties: false
      required:
        - email
        - linkedAt
      properties:
        email:
          type: string
          description: The email the provider confirmed when the link was made
        linkedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    PasskeyOptions:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - options
      properties:
        challengeId:
          $ref: '#/components/schemas/Id'
        options:
          type: object
          additionalProperties: true
          description: PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON
    PasskeyResponse:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - credential
      properties:
        challengeId:
          $ref: '#/components/schemas/Id'
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential.toJSON()
    Passkey:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - createdAt
        - backedUp
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        backedUp:
          type: boolean
          description: Synced to a password manager or cloud keychain, so it survives losing the device.
    Passkeys:
      type: object
      additionalProperties: false
      required:
        - passkeys
      properties:
        passkeys:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Passkey'
    NewPasskey:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - name
        - credential
      properties:
        challengeId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 80
        credential:
          type: object
          additionalProperties: true
          description: PublicKeyCredential.toJSON()
    ProfileColor:
      type: string
      enum:
        - rose
        - sage
        - sky
        - butter
        - lilac
        - peach
        - teal
        - sand
    Child:
      type: object
      required:
        - id
        - name
        - color
        - archived
        - version
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        color:
          $ref: '#/components/schemas/ProfileColor'
        archived:
          type: boolean
        version:
          type: integer
    ChildName:
      type: string
      minLength: 1
      maxLength: 40
      pattern: \S
    Credential:
      type: object
      required:
        - id
        - kind
        - name
        - scopes
        - allChildren
        - childIds
        - awardRuleIds
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
            - service
            - assistant
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        allChildren:
          type: boolean
        childIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        awardRuleIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Pairing:
      type: object
      required:
        - code
        - expiresAt
      properties:
        code:
          type: string
          description: Six letters and digits, without 0, O, 1, I or L
          examples:
