name: iOS

# Builds the iOS app and its extensions for the simulator and runs the unit tests, with no
# signing (ios/scripts/ci.sh, which also runs locally). Screen Time itself can't be exercised in
# the simulator; see ios/README.md for what needs a real device.
#
# Public repository: GitHub-hosted runners only, never self-hosted.

on:
  push:
    branches: [main]
    paths: [ios/**, .github/workflows/ios.yml]
  pull_request:
    paths: [ios/**, .github/workflows/ios.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  simulator:
    name: Simulator build and unit tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - run: ios/scripts/ci.sh
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: ios/build/Tests.xcresult
          retention-days: 7
