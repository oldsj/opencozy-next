name: CI

# Each job runs `make` targets, so `make ci` reproduces CI locally.
#
# Public repository: every job runs on GitHub-hosted runners. Never point it at self-hosted
# runners; a fork's pull request would run them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  lint:
    name: Generated code and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: make gen-check
      - run: make lint
      # The web unit tests need no database, so they run here rather than in the Go test job.
      - run: make test-web

  test:
    name: Tests (Go -race on Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Dockerfile's build image, so tests and the binary use one toolchain.
    container:
      image: golang:1.27.4-trixie@sha256:b54b2639de8c1bfe538ec5ffc45f29b1932235ac5f6d63c059853646677112d9
    # compose.yaml's image and credentials. The data directory is under /tmp because the job container
    # runs as a user the image doesn't know.
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app-dev-only
          POSTGRES_DB: app
          PGDATA: /tmp/pgdata
    env:
      # The service container's name.
      PG_HOST: postgres
      TEST_DATABASE_URL: postgres://app:app-dev-only@postgres:5432/app?sslmode=disable
      # Caches under /tmp: the image's own belong to root.
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 60); do
            if (exec 3<>"/dev/tcp/$PG_HOST/5432") 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "PostgreSQL did not start listening on $PG_HOST:5432" >&2
          exit 1
        shell: bash
      # DB_UP= skips the Compose Postgres: the service above is the database.
      - run: make test-go DB_UP=

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # On the runner itself, not in Playwright's container: the service's port is then on
    # localhost, and the app refuses sslmode=disable for any other database host.
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app-dev-only
          POSTGRES_DB: app_e2e
          PGDATA: /tmp/pgdata
        ports:
          - 5432:5432
    env:
      PG_HOST: localhost
      E2E_DATABASE_URL: postgres://app:app-dev-only@localhost:5432/app_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 60); do
            if (exec 3<>"/dev/tcp/$PG_HOST/5432") 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "PostgreSQL did not start listening on $PG_HOST:5432" >&2
          exit 1
        shell: bash
      # `make e2e` without its Compose database reset (the service above is a fresh app_e2e), spelled
      # out here. Keep in step with the build-e2e and e2e targets.
      - run: pnpm --dir web build
      # An e2e build: its calendar client may reach 127.0.0.1, where the tests serve a fixture feed.
      - run: CGO_ENABLED=0 go build -tags embedweb,e2e -trimpath -o bin/app ./cmd/app
      - name: The release check refuses this e2e binary
        run: "! scripts/check-release-binary.sh bin/app"
      - name: The e2e build opens only the calendar client's 127.0.0.1 and ::1
        run: go test -tags e2e -run TestE2EBuild ./internal/egress/
      - run: pnpm exec playwright test
        working-directory: web
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  design:
    name: Design system (previews, tokens, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: make design
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-previews
          path: web/design/dist
          retention-days: 7

  security:
    name: Vulnerability scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # govulncheck and osv-scanner are pinned in tools/go.mod: no container action needed.
      - run: make security

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the version-bump check compares with the base
      - name: Install checksum-verified Helm and kubeconform
        run: |
          tools_dir=$(mktemp -d)
          bash scripts/install-chart-tools.sh "$tools_dir"
          echo "$tools_dir" >> "$GITHUB_PATH"
      - run: make chart
        env:
          CHART_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

  image:
    name: Image (amd64 + arm64)
    needs: [lint, test, e2e, design, security, chart]
    # Only main pushes the image. `make image` builds the same Dockerfile locally.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One builder makes both platforms without emulation: the Dockerfile's build stages run on
      # the builder's platform and cross-compile.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Before pushing: the binary in the release image must be a release build (no e2e tag), read
      # from its own build info.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: opencozy-release-check
          cache-from: type=gha
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: The release image's binary is a release build
        run: |
          cid=$(docker create opencozy-release-check)
          docker cp "$cid:/app" ./release-app
          docker rm "$cid"
          scripts/check-release-binary.sh ./release-app
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance and an SPDX SBOM, attached to the image index in GHCR.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
