{{- /*
Slice 0c. Outbound traffic for integrations, as a second NetworkPolicy: policies are additive,
so this only adds to networkpolicy.yaml's DNS and database rules. The address ranges match
internal/egress's public check; the app still checks every address and hostname (design §10).
*/ -}}
{{- $e := .Values.egress }}
{{- if and .Values.networkPolicy.enabled (or $e.internet $e.homeAssistant.cidrs $e.oidc.cidrs) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" . }}-egress
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- if $e.internet }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
        - ipBlock:
            cidr: 2000::/3
            except:
              - 2001::/23
              - 2001:db8::/32
              - 2002::/16
              - 3fff::/20
      ports:
        {{- range list 80 443 8080 8443 }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- range $name, $peer := dict "homeAssistant" $e.homeAssistant "oidc" $e.oidc }}
    {{- if $peer.cidrs }}
    # {{ $name }}: its private allowlist
    - to:
        {{- range $peer.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range required (printf "egress.%s.ports is required with egress.%s.cidrs" $name $name) $peer.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
