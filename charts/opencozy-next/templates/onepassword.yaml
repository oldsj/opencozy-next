{{- with .Values.onepassword.itemPath }}
# The 1Password operator turns this into Secret {{ include "app.fullname" $ }}-secrets.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: {{ include "app.fullname" $ }}-secrets
  labels:
    {{- include "app.labels" $ | nindent 4 }}
type: Opaque
spec:
  itemPath: {{ . | quote }}
{{- end }}
